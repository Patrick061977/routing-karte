        function BuchhaltungApp() {
            const [activeTab, setActiveTab] = useState('dokumente'); // NEU: Dokumente als Standard
            const [dokumente, setDokumente] = useState([]);
            const [ordner, setOrdner] = useState([]);
            const [selectedOrdner, setSelectedOrdner] = useState('alle');
            const [loading, setLoading] = useState(true);
            const [uploading, setUploading] = useState(false);
            const [uploadProgress, setUploadProgress] = useState({ current: 0, total: 0, file: '', status: '' });
            const [selectedDokument, setSelectedDokument] = useState(null);
            const [hoverPreview, setHoverPreview] = useState(null); // NEU: { thumbnail, dokId }
            const [draggedDoc, setDraggedDoc] = useState(null); // NEU: Drag & Drop
            const [searchTerm, setSearchTerm] = useState('');
            const [statusFilter, setStatusFilter] = useState('alle');
            const [sortBy, setSortBy] = useState('datum');
            const [sortOrder, setSortOrder] = useState('desc');
            const [kiRegeln, setKiRegeln] = useState([]); // NEU: KI-Lernregeln
            const [faelligeHeute, setFaelligeHeute] = useState([]);
            const [faelligDieseWoche, setFaelligDieseWoche] = useState([]);
            const [anomalien, setAnomalien] = useState([]);
            const [kategorieVorschlag, setKategorieVorschlag] = useState(null);
            const [dublettenWarnung, setDublettenWarnung] = useState(null);
            const [customOrdner, setCustomOrdner] = useState([]); // NEU: Benutzerdefinierte Ordner
            const [showCleanupModal, setShowCleanupModal] = useState(false); // NEU: Cleanup Modal

            useEffect(() => {
                loadData();
                
                // Lade benutzerdefinierte Ordner
                const ordnerConfig = JSON.parse(localStorage.getItem('ordnerConfig') || '{}');
                setCustomOrdner(Object.keys(ordnerConfig));
            }, []);

            async function loadData() {
                try {
                    setLoading(true);
                    const snapshot = await db.collection('dokumente').orderBy('datum', 'desc').get();
                    const data = snapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data()
                    }));
                    setDokumente(data);
                    
                    // Ordner extrahieren - AUTO-ORDNER nach Absender
                    const rawOrdner = data.map(d => d.absender || d.lieferant).filter(Boolean);
                    
                    // NEU: Filtere Müll-Ordner raus
                    const cleanOrdner = rawOrdner.filter(name => {
                        // Mindestlänge
                        if (name.length < 3) return false;
                        // Maximallänge
                        if (name.length > 60) return false;
                        // Keine reinen Sonderzeichen
                        if (name.match(/^[\{\}\[\]\|\\\/<>]+$/)) return false;
                        // Nicht mit Zahlen starten
                        if (name.match(/^[\d\.\-\/\s]+/)) return false;
                        // Keine "Finanzierungs-Nr" Namen
                        if (name.toLowerCase().startsWith('finanzierungs')) return false;
                        // Keine Adressen als Namen
                        if (name.match(/\d{5}\s+[A-ZÄÖÜ]/)) {
                            // Wenn PLZ drin: Nur behalten wenn am Ende
                            const beforePlz = name.split(/\d{5}/)[0].trim();
                            if (beforePlz.length > 10) return false;
                        }
                        return true;
                    });
                    
                    const uniqueOrdner = [...new Set(cleanOrdner)];
                    console.log('📂 DEBUG: Auto-Ordner (nach Absender):', uniqueOrdner);
                    
                    // Custom-Ordner aus localStorage laden
                    const ordnerConfig = JSON.parse(localStorage.getItem('ordnerConfig') || '{}');
                    const customOrdnerNamen = Object.keys(ordnerConfig);
                    console.log('📍 DEBUG: Custom-Ordner (localStorage):', customOrdnerNamen);
                    
                    // BEIDE zusammenführen und sortieren
                    const alleOrdner = [...new Set([...uniqueOrdner, ...customOrdnerNamen])].sort();
                    console.log('📁 DEBUG: ALLE Ordner zusammen:', alleOrdner);
                    setOrdner(alleOrdner);
                    setCustomOrdner(customOrdnerNamen);
                    
                    // NEU: KI-Regeln laden
                    await loadKiRegeln();
                    
                    // NEU: Intelligente Analysen durchführen
                    analyseSmartData(data);
                } catch (error) {
                    console.error('Fehler beim Laden:', error);
                } finally {
                    setLoading(false);
                }
            }
            
            // NEU: KI-Regeln aus Firebase laden
            async function loadKiRegeln() {
                try {
                    const snapshot = await db.collection('ki_regeln').get();
                    const regeln = snapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data()
                    }));
                    setKiRegeln(regeln);
                } catch (error) {
                    console.warn('KI-Regeln konnten nicht geladen werden (Firebase Permissions fehlen):', error.message);
                    // Nicht kritisch - weiter ohne KI-Regeln
                    setKiRegeln([]);
                }
            }
            
            // NEU: Intelligente Daten-Analyse
            function analyseSmartData(data) {
                const heute = new Date();
                heute.setHours(0, 0, 0, 0);
                
                const naechsteWoche = new Date();
                naechsteWoche.setDate(naechsteWoche.getDate() + 7);
                
                // Fällig heute
                const heuteF = data.filter(d => {
                    if (d.status === 'bezahlt' || d.status === 'gebucht') return false;
                    const faellig = d.faelligkeitsdatum || d.faelligAm;
                    if (!faellig) return false;
                    const faelligDate = new Date(faellig);
                    faelligDate.setHours(0, 0, 0, 0);
                    return faelligDate.getTime() === heute.getTime();
                });
                setFaelligeHeute(heuteF);
                
                // Fällig diese Woche
                const wocheF = data.filter(d => {
                    if (d.status === 'bezahlt' || d.status === 'gebucht') return false;
                    const faellig = d.faelligkeitsdatum || d.faelligAm;
                    if (!faellig) return false;
                    const faelligDate = new Date(faellig);
                    return faelligDate >= heute && faelligDate <= naechsteWoche;
                });
                setFaelligDieseWoche(wocheF);
                
                // Anomalien erkennen
                const anomalienList = [];
                
                // Ungewöhnlich hohe Beträge pro Kategorie
                const kategorienStats = {};
                data.forEach(d => {
                    if (!d.kategorie || !d.betrag) return;
                    if (!kategorienStats[d.kategorie]) {
                        kategorienStats[d.kategorie] = [];
                    }
                    kategorienStats[d.kategorie].push(parseFloat(d.betrag));
                });
                
                Object.entries(kategorienStats).forEach(([kategorie, betraege]) => {
                    if (betraege.length < 3) return;
                    const durchschnitt = betraege.reduce((a, b) => a + b, 0) / betraege.length;
                    const max = Math.max(...betraege);
                    
                    if (max > durchschnitt * 2) {
                        anomalienList.push({
                            typ: 'hoher_betrag',
                            kategorie,
                            text: `${kategorie}: Ungewöhnlich hoher Betrag (${max.toFixed(2)} € - Durchschnitt: ${durchschnitt.toFixed(2)} €)`
                        });
                    }
                });
                
                setAnomalien(anomalienList);
            }

            async function handleFileUpload(files) {
                setUploading(true);
                const fileArray = Array.from(files);
                setUploadProgress({ current: 0, total: fileArray.length, file: '', status: 'Starte...' });
                
                for (let i = 0; i < fileArray.length; i++) {
                    const file = fileArray[i];
                    if (file.type === 'application/pdf') {
                        try {
                            setUploadProgress({ 
                                current: i + 1, 
                                total: fileArray.length, 
                                file: file.name,
                                status: 'OCR-Analyse läuft...'
                            });
                            await processPDFWithTesseract(file);
                        } catch (error) {
                            console.error(`Fehler bei ${file.name}:`, error);
                            alert(`Fehler beim Verarbeiten von ${file.name}: ${error.message}`);
                        }
                    }
                }
                
                setUploading(false);
                setUploadProgress({ current: 0, total: 0, file: '', status: '' });
                await loadData();
            }

            async function processPDFWithTesseract(file) {
                // 1. PDF hochladen zu Firebase Storage
                setUploadProgress(prev => ({ ...prev, status: 'Lade PDF hoch...' }));
                const timestamp = Date.now();
                const filename = `${timestamp}_${file.name}`;
                const storageRef = storage.ref(`pdfs/${filename}`);
                await storageRef.put(file);
                const pdfUrl = await storageRef.getDownloadURL();

                // 2. PDF zu Bildern konvertieren mit PDF.js
                setUploadProgress(prev => ({ ...prev, status: 'Konvertiere PDF zu Bildern...' }));
                const arrayBuffer = await file.arrayBuffer();
                const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
                const pdf = await loadingTask.promise;
                
                let fullText = '';
                let avgConfidence = 0;
                const pageTexts = [];

                // 3. Jede Seite mit Tesseract OCR analysieren
                for (let pageNum = 1; pageNum <= Math.min(pdf.numPages, 10); pageNum++) {
                    setUploadProgress(prev => ({ 
                        ...prev, 
                        status: `OCR-Analyse: Seite ${pageNum}/${Math.min(pdf.numPages, 10)}...` 
                    }));

                    const page = await pdf.getPage(pageNum);
                    const viewport = page.getViewport({ scale: 2.0 });
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    await page.render({
                        canvasContext: context,
                        viewport: viewport
                    }).promise;

                    // Tesseract OCR auf dem Canvas-Bild
                    const result = await Tesseract.recognize(
                        canvas,
                        'deu',
                        {
                            logger: m => {
                                if (m.status === 'recognizing text') {
                                    setUploadProgress(prev => ({ 
                                        ...prev, 
                                        status: `OCR Seite ${pageNum}: ${Math.round(m.progress * 100)}%` 
                                    }));
                                }
                            }
                        }
                    );

                    pageTexts.push(result.data.text);
                    fullText += result.data.text + '\n\n';
                    avgConfidence += result.data.confidence;
                }

                avgConfidence = avgConfidence / Math.min(pdf.numPages, 10);

                // 4. Thumbnail erstellen
                setUploadProgress(prev => ({ ...prev, status: 'Erstelle Vorschaubild...' }));
                const firstPage = await pdf.getPage(1);
                const thumbViewport = firstPage.getViewport({ scale: 0.5 });
                const thumbCanvas = document.createElement('canvas');
                const thumbContext = thumbCanvas.getContext('2d');
                thumbCanvas.height = thumbViewport.height;
                thumbCanvas.width = thumbViewport.width;
                
                await firstPage.render({
                    canvasContext: thumbContext,
                    viewport: thumbViewport
                }).promise;
                
                const thumbnailDataUrl = thumbCanvas.toDataURL('image/jpeg', 0.7);

                // 5. Intelligente Analyse des Textes
                setUploadProgress(prev => ({ ...prev, status: 'Analysiere Dokument...' }));
                const analysis = analyzeTextIntelligent(fullText, avgConfidence);

                // 5a. NEU: Dubletten-Check
                setUploadProgress(prev => ({ ...prev, status: 'Prüfe auf Duplikate...' }));
                
                // Prüfe auf Duplikate
                const potentialDuplicates = dokumente.filter(dok => {
                    // Check 1: Gleicher Absender
                    const absenderMatch = dok.absender && analysis.absender && 
                        dok.absender.toLowerCase().includes(analysis.absender.toLowerCase().substring(0, 10));
                    
                    // Check 2: Ähnlicher Betrag (±5%)
                    const betragMatch = dok.betrag && analysis.betrag && 
                        Math.abs(dok.betrag - analysis.betrag) / analysis.betrag < 0.05;
                    
                    // Check 3: Ähnliches Datum (±7 Tage)
                    let datumMatch = false;
                    if (dok.datum && analysis.datum) {
                        const diff = Math.abs(new Date(dok.datum) - new Date(analysis.datum)) / (1000 * 60 * 60 * 24);
                        datumMatch = diff <= 7;
                    }
                    
                    // Check 4: Gleiche Rechnungsnummer
                    const rechnungMatch = dok.rechnungsnummer && analysis.rechnungsnummer && 
                        dok.rechnungsnummer === analysis.rechnungsnummer;
                    
                    // Duplikat wenn: (Absender UND Betrag UND Datum) ODER Rechnungsnummer
                    return rechnungMatch || (absenderMatch && betragMatch && datumMatch);
                });
                
                const duplicate = potentialDuplicates.length > 0 ? potentialDuplicates[0] : null;
                
                if (duplicate) {
                    // Duplikat gefunden - zeige Warnung
                    return new Promise((resolve) => {
                        setDublettenWarnung({
                            neuesDok: {
                                dateiname: file.name,
                                absender: analysis.absender,
                                betrag: analysis.betrag,
                                datum: analysis.datum,
                            },
                            existingDok: duplicate,
                            onConfirm: async () => {
                                setDublettenWarnung(null);
                                // User will trotzdem hochladen - weiter mit Kategorie-Vorschlag
                                await continueUploadProcess(file, pdfUrl, thumbnailDataUrl, fullText, avgConfidence, analysis);
                                resolve();
                            },
                            onCancel: () => {
                                setDublettenWarnung(null);
                                // Abbrechen - lösche hochgeladenes PDF
                                storage.refFromURL(pdfUrl).delete();
                                resolve();
                            }
                        });
                    });
                } else {
                    // Kein Duplikat - weiter normal
                    await continueUploadProcess(file, pdfUrl, thumbnailDataUrl, fullText, avgConfidence, analysis);
                }
            }
            
            // NEU: Upload fortsetzen nach Dubletten-Check
            async function continueUploadProcess(file, pdfUrl, thumbnailDataUrl, fullText, avgConfidence, analysis) {
                // 6. NEUES FEATURE: Kategorie-Vorschlag anzeigen
                const dokumentDaten = {
                    dateiname: file.name,
                    pdfUrl: pdfUrl,
                    thumbnail: thumbnailDataUrl,
                    volltext: fullText.substring(0, 15000),
                    absender: analysis.absender || 'Unbekannt',
                    betrag: analysis.betrag || 0,
                    datum: analysis.datum || new Date().toISOString().split('T')[0],
                    rechnungsnummer: analysis.rechnungsnummer,
                    kategorie: analysis.kategorie || 'Sonstiges',
                    kategorieVorschlaege: analysis.kategorieVorschlaege,
                    faelligkeitsdatum: analysis.faelligkeitsdatum,
                    zusammenfassung: analysis.zusammenfassung,
                    wichtigePunkte: analysis.wichtigePunkte,
                    ocrConfidence: avgConfidence,
                    ordner: '', // Wird im Modal gesetzt
                };
                
                // Zeige Vorschlags-Modal immer (für Ordner-Auswahl)
                return new Promise((resolve) => {
                    setKategorieVorschlag({
                        ...dokumentDaten,
                        customOrdner: customOrdner, // NEU: Custom Ordner übergeben
                        onAccept: async (data) => {
                            setKategorieVorschlag(null);
                            await saveDokument(data);
                            resolve();
                        },
                        onReject: () => {
                            setKategorieVorschlag(null);
                            // PDF löschen wenn abgebrochen
                            storage.refFromURL(pdfUrl).delete();
                            resolve();
                        }
                    });
                });
            }
            
            // Hilfsfunktion zum Speichern
            async function saveDokument(dokData) {
                console.log('🔧 DEBUG: saveDokument aufgerufen mit:', dokData);
                console.log('📁 DEBUG: Ordner:', dokData.ordner);
                
                const dokument = {
                    dateiname: dokData.dateiname,
                    pdfUrl: dokData.pdfUrl,
                    thumbnail: dokData.thumbnail,
                    volltext: dokData.volltext,
                    absender: dokData.absender,
                    lieferant: dokData.absender,
                    beschreibung: `${dokData.kategorie} - ${dokData.absender}`,
                    betrag: dokData.betrag,
                    datum: dokData.datum,
                    rechnungsnummer: dokData.rechnungsnummer,
                    belegnummer: dokData.rechnungsnummer,
                    kategorie: dokData.kategorie,
                    ordner: dokData.ordner || '', // NEU: Ordner speichern
                    faelligkeitsdatum: dokData.faelligkeitsdatum,
                    faelligAm: dokData.faelligkeitsdatum,
                    ustSatz: '19',
                    status: 'offen',
                    prioritaet: 'mittel',
                    typ: 'eingangsrechnung',
                    ocrConfidence: dokData.ocrConfidence,
                    zusammenfassung: dokData.zusammenfassung,
                    wichtigePunkte: dokData.wichtigePunkte,
                    hochgeladenAm: new Date().toISOString(),
                    erstelltAm: new Date().toISOString(),
                    version: VERSION,
                };

                console.log('💾 DEBUG: Speichere Dokument:', dokument);
                await db.collection('dokumente').add(dokument);
                console.log('✅ DEBUG: Dokument gespeichert!');
                await loadData();
                console.log('🔄 DEBUG: Daten neu geladen!');
            }

            function analyzeTextIntelligent(text, confidence) {
                const lowerText = text.toLowerCase();
                const lines = text.split('\n').filter(line => line.trim().length > 0);
                
                // NEU: KATEGORIE mit KONFIDENZ-SCORES bestimmen
                let kategorieScores = {};
                
                // Initialisiere alle Kategorien mit 0
                Object.keys(KATEGORIEN).forEach(kat => {
                    kategorieScores[kat] = 0;
                });
                
                // Zähle Keyword-Treffer
                for (const [kat, keywords] of Object.entries(KATEGORIEN)) {
                    keywords.forEach(keyword => {
                        const regex = new RegExp(keyword, 'gi');
                        const matches = (lowerText.match(regex) || []).length;
                        kategorieScores[kat] += matches * 10; // Jeder Treffer gibt 10 Punkte
                    });
                }
                
                // KI-Regeln anwenden (geben 50 Punkte!)
                kiRegeln.forEach(regel => {
                    if (regel.typ === 'kategorie' && lowerText.includes(regel.trigger.toLowerCase())) {
                        const katName = regel.wert.toLowerCase();
                        if (kategorieScores[katName] !== undefined) {
                            kategorieScores[katName] += 50;
                        }
                    }
                });
                
                // Sortiere nach Score
                const sortedKategorien = Object.entries(kategorieScores)
                    .sort((a, b) => b[1] - a[1])
                    .filter(([_, score]) => score > 0);
                
                // Berechne Prozent-Konfidenz
                const totalScore = sortedKategorien.reduce((sum, [_, score]) => sum + score, 0);
                const kategorieVorschlaege = sortedKategorien.slice(0, 3).map(([kat, score]) => ({
                    kategorie: kat.charAt(0).toUpperCase() + kat.slice(1),
                    konfidenz: totalScore > 0 ? Math.round((score / totalScore) * 100) : 0,
                    score: score
                }));
                
                // Beste Kategorie wählen
                let kategorie = kategorieVorschlaege.length > 0 ? kategorieVorschlaege[0].kategorie : 'Sonstiges';
                
                // ABSENDER INTELLIGENT erkennen
                let absender = null;
                const behoerdenKeywords = ['hauptzollamt', 'finanzamt', 'zollamt', 'amtsgericht', 'landgericht', 'verwaltung', 'landesamt', 'bundesamt'];
                const istBehoerde = behoerdenKeywords.some(kw => lowerText.includes(kw));
                
                // NEU: VERBESSERTE Firmen-Patterns (Reihenfolge wichtig!)
                const firmenPatterns = [
                    // Gerichtsvollzieher: Nur Name extrahieren
                    {
                        regex: /Obergerichtsvollzieherin?\s+(?:Holunderweg\s+\d+\s+)?([A-ZÄÖÜ][a-zäöüß]+\s+[A-ZÄÖÜ][a-zäöüß]+)/,
                        extract: 1  // Gruppe 1 = nur Name
                    },
                    // Behörden: Nur Hauptname
                    {
                        regex: /(Hauptzollamt|Finanzamt|Amtsgericht)\s+([A-ZÄÖÜ][a-zäöüß]+)/,
                        extract: 0,  // Ganze Match
                        clean: /\s+Sachgebiet.*$/  // Entferne "Sachgebiet..."
                    },
                    // Württembergische
                    {
                        regex: /([NW]\.?\s*württembergische)/i,
                        extract: 0,
                        clean: /\s+Ihr Fels.*$/
                    },
                    // Krankenkassen
                    {
                        regex: /(DAK|Barmer|AOK|TK|Techniker\s+Krankenkasse)[-\s]*(Gesundheit)?/i,
                        extract: 0
                    },
                    // Banken
                    {
                        regex: /([A-ZÄÖÜ][a-zäöüß]+(?:\s+[A-ZÄÖÜ][a-zäöüß]+)*)\s+(?:Consumer\s+)?Bank\s+AG/,
                        extract: 0
                    },
                    // GmbH/AG/KG
                    {
                        regex: /([A-ZÄÖÜ][a-zäöüß]+(?:\s+[+&]\s+[A-ZÄÖÜ][a-zäöüß]+)*)\s+(?:GmbH|AG|KG|OHG)/,
                        extract: 0
                    }
                ];
                
                // Versuche Pattern zu matchen
                for (const pattern of firmenPatterns) {
                    const match = text.match(pattern.regex);
                    if (match) {
                        absender = pattern.extract !== undefined ? match[pattern.extract] : match[0];
                        absender = absender.trim();
                        
                        // Bereinigung anwenden
                        if (pattern.clean) {
                            absender = absender.replace(pattern.clean, '');
                        }
                        
                        // Entferne PLZ/Adresse am Ende
                        absender = absender.replace(/\s+\d{5}\s+[A-ZÄÖÜ][a-zäöüß]+.*$/, '');
                        
                        // Maximal 40 Zeichen
                        if (absender.length > 40) {
                            const words = absender.split(/\s+/);
                            absender = words.slice(0, 3).join(' ');
                        }
                        
                        console.log('✅ DEBUG: Absender via Pattern erkannt:', absender);
                        break;
                    }
                }
                
                // Fallback: Erste sinnvolle Zeile
                if (!absender) {
                    const potentialLines = [];
                    for (let i = 0; i < Math.min(15, lines.length); i++) {
                        const line = lines[i].trim();
                        // Überspringe zu kurze/lange Zeilen
                        if (line.length < 3 || line.length > 80) continue;
                        // Überspringe reine Zahlen
                        if (line.match(/^[\d\s\.\-\/]+$/)) continue;
                        // Überspringe Datumszeilen
                        if (line.match(/\d{1,2}\.\d{1,2}\.\d{2,4}/)) continue;
                        // Überspringe bekannte Müll-Zeilen
                        if (line.toLowerCase().includes('postfach')) continue;
                        if (line.toLowerCase().includes('telefon')) continue;
                        if (line.toLowerCase().includes('e-mail')) continue;
                        if (line.toLowerCase().includes('fax')) continue;
                        if (line.toLowerCase().includes('www.')) continue;
                        if (line.toLowerCase().includes('kontakt')) continue;
                        if (line.toLowerCase().includes('sprechzeiten')) continue;
                        if (line.toLowerCase().startsWith('bei umzug')) continue;
                        
                        potentialLines.push(line);
                        if (potentialLines.length >= 3) break;
                    }
                    
                    if (potentialLines.length > 0) {
                        // Nimm erste Zeile, kürze auf 40 Zeichen
                        absender = potentialLines[0];
                        if (absender.length > 40) {
                            const words = absender.split(/\s+/);
                            absender = words.slice(0, 3).join(' ');
                        }
                        console.log('⚠️ DEBUG: Absender via Fallback:', absender);
                    }
                }
                
                if (!absender) absender = 'Unbekannt';
                
                // KI-Regeln anwenden für Absender-Mapping
                kiRegeln.forEach(regel => {
                    if (regel.typ === 'absender' && absender.toLowerCase().includes(regel.trigger.toLowerCase())) {
                        absender = regel.wert;
                    }
                });

                // BETRAG erkennen - DEUTSCHE ZAHLENFORMATE (2.434,45)
                const betragPatterns = [
                    { regex: /(?:gesamt|summe|total|restforderung|gesamtbetrag|gesamtsaldo)[:\s]+(\d{1,3}(?:\.\d{3})*,\d{2})/gi, priority: 4 },
                    { regex: /(?:betrag)[:\s]+(\d{1,3}(?:\.\d{3})*,\d{2})/gi, priority: 3 },
                    { regex: /(\d{1,3}(?:\.\d{3})*,\d{2})\s*€/g, priority: 2 },
                    { regex: /€\s*(\d{1,3}(?:\.\d{3})*,\d{2})/g, priority: 2 },
                    { regex: /(\d{1,3}(?:\.\d{3})*,\d{2})\s*EUR/gi, priority: 2 },
                ];
                
                let betrag = null;
                let allBetraege = [];
                
                for (const pattern of betragPatterns) {
                    const matches = [...text.matchAll(pattern.regex)];
                    for (const match of matches) {
                        const betragStr = match[1].replace(/\./g, '').replace(',', '.');
                        const betragNum = parseFloat(betragStr);
                        if (!isNaN(betragNum) && betragNum > 0 && betragNum < 1000000) {
                            allBetraege.push({ betrag: betragNum, priority: pattern.priority });
                        }
                    }
                }
                
                if (allBetraege.length > 0) {
                    allBetraege.sort((a, b) => {
                        if (a.priority !== b.priority) return b.priority - a.priority;
                        return b.betrag - a.betrag;
                    });
                    betrag = allBetraege[0].betrag;
                }

                // DATUM erkennen
                const monate = {
                    'januar': '01', 'februar': '02', 'märz': '03', 'april': '04',
                    'mai': '05', 'juni': '06', 'juli': '07', 'august': '08',
                    'september': '09', 'oktober': '10', 'november': '11', 'dezember': '12'
                };
                
                let datum = null;
                const datumPatterns = [
                    /(?:datum)[:\s]+(\d{1,2})[\.\s]+([a-zä]+)\s+(\d{4})/i,
                    /(?:datum|vom|date)[:\s]+(\d{1,2})[.\-\/](\d{1,2})[.\-\/](\d{2,4})/i,
                    /(\d{1,2})[.\-\/](\d{1,2})[.\-\/](\d{4})/,
                ];
                
                for (const pattern of datumPatterns) {
                    const match = text.match(pattern);
                    if (match) {
                        let tag, monat, jahr;
                        if (match[2] && isNaN(match[2])) {
                            tag = match[1].padStart(2, '0');
                            monat = monate[match[2].toLowerCase()] || '01';
                            jahr = match[3];
                        } else {
                            tag = match[1].padStart(2, '0');
                            monat = match[2].padStart(2, '0');
                            jahr = match[3];
                            if (jahr.length === 2) jahr = '20' + jahr;
                        }
                        
                        if (parseInt(monat) >= 1 && parseInt(monat) <= 12 && parseInt(tag) >= 1 && parseInt(tag) <= 31) {
                            datum = `${jahr}-${monat}-${tag}`;
                            break;
                        }
                    }
                }

                // RECHNUNGSNUMMER
                const rechnungsNrPatterns = [
                    /(?:GZ|Geschäftszeichen)[:\s]+([A-Z0-9\-\/\s]+?)(?:\s|$)/i,
                    /Rechnung[s]?[-\s]*(?:Nr\.?|nummer)?[:\s]+([A-Z0-9\-\/]+)/i,
                    /(?:Beleg|Dok)[.-]?(?:Nr\.?)?[:\s]+([A-Z0-9\-\/]+)/i,
                ];
                
                let rechnungsnummer = null;
                for (const pattern of rechnungsNrPatterns) {
                    const match = text.match(pattern);
                    if (match && match[1].trim().length >= 3 && match[1].trim().length <= 40) {
                        rechnungsnummer = match[1].trim().replace(/\s+/g, ' ');
                        break;
                    }
                }

                // FÄLLIGKEITSDATUM
                let faelligkeitsdatum = null;
                if (datum) {
                    const d = new Date(datum);
                    d.setDate(d.getDate() + 14);
                    faelligkeitsdatum = d.toISOString().split('T')[0];
                }

                // ZUSAMMENFASSUNG erstellen
                const saetze = text.match(/[^.!?]+[.!?]+/g) || [];
                const zusammenfassung = saetze.slice(0, 3).join(' ').trim().substring(0, 300);

                // WICHTIGE PUNKTE extrahieren
                const wichtigePunkte = [];
                if (betrag) wichtigePunkte.push(`Betrag: ${betrag.toFixed(2)} €`);
                if (rechnungsnummer) wichtigePunkte.push(`Rechnungs-Nr: ${rechnungsnummer}`);
                if (faelligkeitsdatum) wichtigePunkte.push(`Fällig am: ${new Date(faelligkeitsdatum).toLocaleDateString('de-DE')}`);
                if (lowerText.includes('mahnung')) wichtigePunkte.push('⚠️ Mahnung');
                if (lowerText.includes('überfällig')) wichtigePunkte.push('⚠️ Überfällig');
                if (lowerText.includes('dringend')) wichtigePunkte.push('⚠️ Dringend');

                const beschreibung = `${kategorie} - ${absender}`;

                return {
                    absender,
                    betrag,
                    datum,
                    rechnungsnummer,
                    kategorie,
                    faelligkeitsdatum,
                    beschreibung,
                    zusammenfassung,
                    wichtigePunkte,
                    kategorieVorschlaege // NEU: Rückgabe der Top 3 Vorschläge
                };
            }

            async function updateStatus(id, newStatus) {

                await loadData();

            async function updateDokument(id, data) {
                const alteDaten = dokumente.find(d => d.id === id);
                
                await db.collection('dokumente').doc(id).update(data);
                
                // NEU: KI lernt aus Änderungen
                if (alteDaten) {
                    // Kategorie-Änderung → Regel lernen
                    if (data.kategorie && data.kategorie !== alteDaten.kategorie && alteDaten.absender) {
                        await lernKiRegel('kategorie', alteDaten.absender, data.kategorie);
                    }
                    
                    // Absender-Änderung → Regel lernen
                    if (data.absender && data.absender !== alteDaten.absender && alteDaten.absender) {
                        await lernKiRegel('absender', alteDaten.absender, data.absender);
                    }
                }
                
                await loadData();
            }
            
            // NEU: Ordner bereinigen
            function cleanupOrdner() {
                const ordnerConfig = JSON.parse(localStorage.getItem('ordnerConfig') || '{}');
                const vorher = Object.keys(ordnerConfig).length;
                
                const cleaned = {};
                const geloescht = [];
                
                Object.keys(ordnerConfig).forEach(name => {
                    // Filter: Gute Ordner behalten
                    if (name.length >= 5 && 
                        name.length <= 50 && 
                        !name.toLowerCase().includes('finanzierungs') &&
                        name.match(/[A-ZÄÖÜa-zäöüß]{3,}/)) {
                        cleaned[name] = ordnerConfig[name];
                    } else {
                        geloescht.push(name);
                    }
                });
                
                // Speichere bereinigte Config
                localStorage.setItem('ordnerConfig', JSON.stringify(cleaned));
                
                const nachher = Object.keys(cleaned).length;
                console.log(`🧹 Cleanup: ${vorher} → ${nachher} (${geloescht.length} gelöscht)`);
                
                // Seite neu laden
                loadData();
                setShowCleanupModal(false);
                
                return { vorher, nachher, geloescht };
            }
            
            // NEU: Datenbank-Cleanup - Korrigiert Absender in ALLEN Dokumenten
            async function cleanupDatenbank() {
                if (!confirm('🔧 DATENBANK-CLEANUP\n\nDas korrigiert die Absender-Namen in ALLEN Dokumenten!\n\n⚠️ Kann 1-2 Minuten dauern bei vielen Dokumenten.\n\nFortfahren?')) {
                    return;
                }
                
                try {
                    console.log('🔧 Starte Datenbank-Cleanup...');
                    
                    // Lade ALLE Dokumente
                    const snapshot = await db.collection('dokumente').get();
                    const docs = snapshot.docs;
                    console.log(`📄 Gefunden: ${docs.length} Dokumente`);
                    
                    let geaendert = 0;
                    let fehler = 0;
                    
                    for (const doc of docs) {
                        const data = doc.data();
                        const alterAbsender = data.absender;
                        
                        if (!alterAbsender || alterAbsender === 'Unbekannt') continue;
                        
                        // Bereinige Absender
                        let neuerAbsender = alterAbsender;
                        
                        // Zu lang? Kürzen auf 40 Zeichen
                        if (neuerAbsender.length > 40) {
                            const words = neuerAbsender.split(/\s+/);
                            neuerAbsender = words.slice(0, 3).join(' ');
                        }
                        
                        // Spezifische Patterns
                        // "Obergerichtsvollzieherin ... Name" → "Name"
                        const gvMatch = neuerAbsender.match(/Obergerichtsvollzieherin?\s+(?:Holunderweg\s+\d+\s+)?([A-ZÄÖÜ][a-zäöüß]+\s+[A-ZÄÖÜ][a-zäöüß]+)/);
                        if (gvMatch) {
                            neuerAbsender = gvMatch[1];
                        }
                        
                        // "Hauptzollamt X Sachgebiet..." → "Hauptzollamt X"
                        neuerAbsender = neuerAbsender.replace(/\s+Sachgebiet.*$/, '');
                        
                        // "X Ihr Fels in der Brandung" → "X"
                        neuerAbsender = neuerAbsender.replace(/\s+Ihr Fels.*$/, '');
                        
                        // Trim
                        neuerAbsender = neuerAbsender.trim();
                        
                        // Hat sich was geändert?
                        if (neuerAbsender !== alterAbsender) {
                            try {
                                await db.collection('dokumente').doc(doc.id).update({
                                    absender: neuerAbsender,
                                    lieferant: neuerAbsender
                                });
                                console.log(`✅ ${alterAbsender} → ${neuerAbsender}`);
                                geaendert++;
                            } catch (err) {
                                console.error(`❌ Fehler bei ${doc.id}:`, err);
                                fehler++;
                            }
                        }
                    }
                    
                    console.log(`🎉 Cleanup fertig! ${geaendert} Dokumente korrigiert, ${fehler} Fehler`);
                    alert(`✅ Datenbank-Cleanup abgeschlossen!\n\nDokumente korrigiert: ${geaendert}\nFehler: ${fehler}\n\nSeite wird neu geladen...`);
                    
                    // Seite neu laden
                    window.location.reload();
                    
                } catch (error) {
                    console.error('❌ Cleanup-Fehler:', error);
                    alert('❌ Fehler beim Cleanup! Siehe Konsole.');
                }
            }
            
            // NEU: KI-Regel lernen
            async function lernKiRegel(typ, trigger, wert) {
                try {
                    // Prüfe ob Regel schon existiert
                    const existiert = await db.collection('ki_regeln')
                        .where('typ', '==', typ)
                        .where('trigger', '==', trigger)
                        .get();
                    
                    if (existiert.empty) {
                        // Neue Regel erstellen
                        await db.collection('ki_regeln').add({
                            typ,
                            trigger,
                            wert,
                            gelerntAm: new Date().toISOString(),
                            angewendet: 1
                        });
                        console.log(`✅ KI gelernt: ${trigger} → ${wert}`);
                    } else {
                        // Regel aktualisieren (Zähler erhöhen)
                        const regel = existiert.docs[0];
                        await db.collection('ki_regeln').doc(regel.id).update({
                            wert, // Wert aktualisieren falls geändert
                            angewendet: (regel.data().angewendet || 0) + 1
                        });
                        console.log(`✅ KI-Regel verstärkt: ${trigger} → ${wert}`);
                    }
                    
                    await loadKiRegeln();
                } catch (error) {
                    console.error('Fehler beim Lernen:', error);
                }
            }

                        bVal = parseFloat(b.betrag || 0);
                        break;

                        aVal = (a.absender || a.lieferant || '').toLowerCase();
                        bVal = (b.absender || b.lieferant || '').toLowerCase();

                        aVal = a.status || '';

                        break;
                    default:

                }
            });

            };

                            <p className="text-xl text-gray-600">Lade Daten aus Firebase...</p>
                        </div>

                );

                                        <span className="text-xs text-blue-200">Premium OCR</span>

                    {/* Main Content */}

        function Dashboard({ stats, dokumente, version, updateStatus, setSelectedDokument, updateDokument, ordner }) {
            const [editing, setEditing] = useState(false);
            const [editData, setEditData] = useState({});

                    dok.rechnungsnummer?.toLowerCase().includes(searchTerm.toLowerCase());
                const matchStatus = statusFilter === 'alle' || dok.status === statusFilter;
                
                return matchOrdner && matchSearch && matchStatus;
            });

            return (
                <div className="flex gap-6">
                    {/* Sidebar - Ordner */}
                    <div className="w-64 bg-white rounded-lg shadow-md p-4 h-fit">
                        <div className="flex justify-between items-center mb-3">
                            <h2 className="font-bold text-gray-800">📁 Ordner</h2>
                            <div className="flex gap-1">
                                <button
                                    onClick={async () => {
                                        if (!confirm('🔧 DATENBANK-CLEANUP\n\nDas korrigiert die Absender-Namen in ALLEN Dokumenten!\n\n⚠️ Kann 1-2 Minuten dauern bei vielen Dokumenten.\n\nFortfahren?')) {
                                            return;
                                        }
                                        
                                        try {
                                            console.log('🔧 Starte Datenbank-Cleanup...');
                                            const snapshot = await db.collection('dokumente').get();
                                            const docs = snapshot.docs;
                                            console.log(`📄 Gefunden: ${docs.length} Dokumente`);
                                            
                                            let geaendert = 0;
                                            for (const doc of docs) {
                                                const data = doc.data();
                                                const alterAbsender = data.absender;
                                                if (!alterAbsender || alterAbsender === 'Unbekannt') continue;
                                                
                                                let neuerAbsender = alterAbsender;
                                                
                                                // NEU: Erkennt Müll-Absender und setzt zu "Unbekannt"
                                                if (neuerAbsender.match(/^[^a-zA-ZäöüÄÖÜß]*[a-zA-ZäöüÄÖÜß]{0,2}[^a-zA-ZäöüÄÖÜß]*$/) || 
                                                    neuerAbsender.match(/^[\d\.\-\/\s]+/) ||
                                                    neuerAbsender.includes('e.0n') ||
                                                    neuerAbsender.match(/^[\d\/\-\.\s]+$/)) {
                                                    neuerAbsender = 'Unbekannt';
                                                } else {
                                                    // Zu lang? Kürzen
                                                    if (neuerAbsender.length > 40) {
                                                        const words = neuerAbsender.split(/\s+/);
                                                        neuerAbsender = words.slice(0, 3).join(' ');
                                                    }
                                                    
                                                    // Gerichtsvollzieher Pattern
                                                    const gvMatch = neuerAbsender.match(/Obergerichtsvollzieherin?\s+.*?([A-ZÄÖÜ][a-zäöüß]+\s+[A-ZÄÖÜ][a-zäöüß]+)/);
                                                    if (gvMatch) neuerAbsender = gvMatch[1];
                                                    
                                                    // Entferne spezifische Suffixe
                                                    neuerAbsender = neuerAbsender.replace(/\s+Sachgebiet.*$/, '');
                                                    neuerAbsender = neuerAbsender.replace(/\s+Ihr Fels.*$/, '');
                                                    neuerAbsender = neuerAbsender.replace(/\s+Holunderweg.*$/, '');
                                                    
                                                    // Entferne Punkte/Whitespace am Ende
                                                    neuerAbsender = neuerAbsender.replace(/[\s\.]+$/, '');
                                                    neuerAbsender = neuerAbsender.trim();
                                                }
                                                
                                                if (neuerAbsender !== alterAbsender) {
                                                    await db.collection('dokumente').doc(doc.id).update({
                                                        absender: neuerAbsender,
                                                        lieferant: neuerAbsender
                                                    });
                                                    console.log(`✅ ${alterAbsender} → ${neuerAbsender}`);
                                                    geaendert++;
                                                }
                                            }
                                            
                                            console.log(`🎉 Cleanup fertig! ${geaendert} Dokumente korrigiert`);
                                            alert(`✅ Datenbank-Cleanup abgeschlossen!\n\nDokumente korrigiert: ${geaendert}\n\nSeite wird neu geladen...`);
                                            window.location.reload();
                                        } catch (error) {
                                            console.error('❌ Cleanup-Fehler:', error);
                                            alert('❌ Fehler beim Cleanup! Siehe Konsole.');
                                        }
                                    }}
                                    className="text-xs px-2 py-1 bg-red-600 text-white rounded hover:bg-red-700"
                                    title="Datenbank-Cleanup: Korrigiert Absender in ALLEN Dokumenten"
                                >
                                    🔧
                                </button>
                                <button
                                    onClick={() => {
                                        if (confirm('🧹 Müll-Ordner bereinigen?\n\nLöscht alle Ordner mit:\n- Weniger als 5 Zeichen\n- Mehr als 50 Zeichen\n- "Finanzierungs-Nr..." Namen\n\nFortfahren?')) {
                                            const ordnerConfig = JSON.parse(localStorage.getItem('ordnerConfig') || '{}');
                                            const vorher = Object.keys(ordnerConfig).length;
                                            const cleaned = {};
                                            Object.keys(ordnerConfig).forEach(name => {
                                                if (name.length >= 5 && name.length <= 50 && !name.toLowerCase().includes('finanzierungs') && name.match(/[A-ZÄÖÜa-zäöüß]{3,}/)) {
                                                    cleaned[name] = ordnerConfig[name];
                                                }
                                            });
                                            localStorage.setItem('ordnerConfig', JSON.stringify(cleaned));
                                            const nachher = Object.keys(cleaned).length;
                                            alert('✅ Bereinigung abgeschlossen!\n\nVorher: ' + vorher + ' Ordner\nNachher: ' + nachher + ' Ordner\nGelöscht: ' + (vorher - nachher));
                                            window.location.reload();
                                        }

                                    title="Müll-Ordner bereinigen"

                                </button>
                                <button
                                    onClick={() => {

                                        // Speichere Ordner-Konfiguration
                                        const ordnerConfig = JSON.parse(localStorage.getItem('ordnerConfig') || '{}');
                                        ordnerConfig[name.trim()] = {
                                            adresse: adresse?.trim() || '',

                                        };
                                        localStorage.setItem('ordnerConfig', JSON.stringify(ordnerConfig));
                                        alert('✅ Ordner "' + name.trim() + '" erstellt!');
                                        window.location.reload();
                                    }
                                }}

                                title="Neuen Ordner erstellen"
                            >
                                ➕
                            </button>
                            </div>
                        </div>
                        
                        <button
                            onClick={() => setSelectedOrdner('alle')}

                            📂 Alle ({dokumente.length})
                        </button>

                        <div className="space-y-1 mt-3">
                            {ordner.map(ord => {

                                const offeneCount = dokumente.filter(d => (d.absender === ord || d.lieferant === ord) && d.status === 'offen').length;
                                return (
                                    <div key={ord} className="flex items-center gap-1">
                                        <button

                                            </div>
                                        </button>
                                        <button
                                            onClick={async (e) => {

                                                if (!confirm(`🗑️ Ordner "${ord}" löschen?\n\nDas ändert alle Dokumente in diesem Ordner zu:\nAbsender: "Unbekannt"\n\n${count} Dokument(e) betroffen.\n\nFortfahren?`)) return;

                                        </button>
                                    </div>
                                );

                        />
                    )}
                </div>

        function UploadZone({ onUpload, uploading, uploadProgress }) {
            const fileInputRef = useRef(null);
            const [dragOver, setDragOver] = useState(false);

            return (
                <div
                    className={`border-2 border-dashed rounded-lg p-8 text-center cursor-pointer transition-colors ${
                        dragOver ? 'drag-over' : 'border-gray-300 bg-white hover:border-blue-400'
                    }`}
                    onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
                    onDragLeave={() => setDragOver(false)}
                    onDrop={(e) => { 
                        e.preventDefault(); 
                        setDragOver(false);
                        if (e.dataTransfer.files.length > 0) onUpload(e.dataTransfer.files);
                    }}
                    onClick={() => !uploading && fileInputRef.current?.click()}
                >
                    <input
                        ref={fileInputRef}
                        type="file"
                        multiple
                        accept="application/pdf"
                        onChange={(e) => { if (e.target.files.length > 0) onUpload(e.target.files); }}
                        className="hidden"
                    />
                    
                    {uploading ? (
                        <div>
                            <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-purple-600 mx-auto mb-3"></div>

                            <p className="text-sm text-gray-600 mb-2">{uploadProgress.file}</p>
                            <div className="w-full bg-gray-200 rounded-full h-2.5 mb-2">
                                <div 
                                    className="bg-purple-600 h-2.5 rounded-full transition-all duration-300" 
                                    style={{ width: `${(uploadProgress.current / uploadProgress.total) * 100}%` }}
                                ></div>
                            </div>
                            <p className="text-xs text-gray-500">Datei {uploadProgress.current} von {uploadProgress.total}</p>
                        </div>
                    ) : (

                        </div>

                absender: dokument.absender || '',
                betrag: dokument.betrag || 0,
                datum: dokument.datum || '',
                rechnungsnummer: dokument.rechnungsnummer || '',
                kategorie: dokument.kategorie || 'Sonstiges',
                beschreibung: dokument.beschreibung || '',
                ordner: dokument.ordner || '', // NEU
            });

            const faellig = dokument.faelligkeitsdatum || dokument.faelligAm;
            const istUeberfaellig = faellig && new Date(faellig) < new Date() && dokument.status === 'offen';
            const textVorschau = dokument.zusammenfassung || (dokument.volltext ? dokument.volltext.substring(0, 200).trim() + '...' : null);
            
            // OCR Confidence Badge
            const confidence = dokument.ocrConfidence || 0;
            let confidenceClass = 'confidence-low';
            let confidenceText = 'Niedrig';
            if (confidence >= 90) {
                confidenceClass = 'confidence-high';
                confidenceText = 'Hoch';
            } else if (confidence >= 70) {
                confidenceClass = 'confidence-medium';
                confidenceText = 'Mittel';
            }

            async function saveEdit() {
                try {
                    await db.collection('dokumente').doc(dokument.id).update({
                        absender: editData.absender,
                        lieferant: editData.absender,
                        betrag: parseFloat(editData.betrag),
                        datum: editData.datum,
                        rechnungsnummer: editData.rechnungsnummer,
                        belegnummer: editData.rechnungsnummer,
                        kategorie: editData.kategorie,
                        beschreibung: editData.beschreibung,

                    setEditing(false);

                                {istUeberfaellig && <span className="text-red-600 font-bold">⚠️ ÜBERFÄLLIG</span>}
                            </div>
                            
                            {/* Wichtige Punkte */}
                            {dokument.wichtigePunkte && dokument.wichtigePunkte.length > 0 && (
                                <div className="mt-2 flex flex-wrap gap-2">
                                    {dokument.wichtigePunkte.map((punkt, idx) => (
                                        <span key={idx} className="text-xs bg-yellow-100 text-yellow-800 px-2 py-1 rounded">
                                            {punkt}
                                        </span>
                                    ))}
                                </div>
                            )}
                            
                            {/* Zusammenfassung */}
                            {textVorschau && !showText && (
                                <div className="mt-3 p-3 bg-gray-50 rounded border border-gray-200">
                                    <p className="text-xs font-semibold text-gray-700 mb-1">📝 Zusammenfassung:</p>
                                    <p className="text-xs text-gray-600 italic">{textVorschau}</p>
                                </div>

                            {/* Volltext */}

                                <div className="mt-3 p-4 bg-gray-50 rounded border border-gray-300 max-h-96 overflow-y-auto">
                                    <h4 className="font-semibold text-sm mb-2">Extrahierter Text (Tesseract OCR):</h4>
                                    <pre className="text-xs text-gray-700 whitespace-pre-wrap font-mono">{dokument.volltext}</pre>
                                </div>
                            )}
                        </div>
                        
                        <div className="flex gap-2 flex-wrap">
                            <select
                                value={dokument.status}
                                onChange={(e) => updateStatus(dokument.id, e.target.value)}
                                className={`px-3 py-1 rounded text-sm status-${dokument.status}`}
                            >
                                <option value="offen">Offen</option>
                                <option value="bearbeitet">Bearbeitet</option>
                                <option value="bezahlt">Bezahlt</option>
                                <option value="gebucht">Gebucht</option>

                            <button
                                onClick={() => setShowText(!showText)}
                                className="px-3 py-1 bg-purple-500 text-white rounded text-sm hover:bg-purple-600"

                            <button

                                ✏️

                            {dokument.pdfUrl && (

                                    <button

                                        👁️
                                    </button>
                                    <a
                                        href={dokument.pdfUrl}

                                        className="px-3 py-1 bg-green-500 text-white rounded text-sm hover:bg-green-600"
                                        onClick={(e) => e.stopPropagation()}
                                    >
                                        📥
                                    </a>
                                </>

                            <button

                                className="px-3 py-1 bg-red-500 text-white rounded text-sm hover:bg-red-600"
                            >
                                🗑️
                            </button>
                        </div>
                    </div>

                    {/* Bearbeiten-Modal */}
                    {editing && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-lg p-6 max-w-2xl w-full">
                                <h3 className="text-xl font-bold mb-4">Dokument bearbeiten</h3>
                                
                                <div className="space-y-4">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-sm font-medium mb-1">Absender/Firma</label>
                                            <input

        function AuswertungenView({ dokumente }) {
            const [zeitraum, setZeitraum] = useState('monat');
            
            const jetzt = new Date();
            let startDatum, endDatum;
            
            if (zeitraum === 'monat') {
                startDatum = new Date(jetzt.getFullYear(), jetzt.getMonth(), 1);
                endDatum = new Date(jetzt.getFullYear(), jetzt.getMonth() + 1, 0);
            } else if (zeitraum === 'quartal') {
                const quartal = Math.floor(jetzt.getMonth() / 3);
                startDatum = new Date(jetzt.getFullYear(), quartal * 3, 1);
                endDatum = new Date(jetzt.getFullYear(), (quartal + 1) * 3, 0);
            } else {
                startDatum = new Date(jetzt.getFullYear(), 0, 1);
                endDatum = new Date(jetzt.getFullYear(), 11, 31);
            }

            const zeitraumDokumente = dokumente.filter(d => {
                const datum = new Date(d.datum);
                return datum >= startDatum && datum <= endDatum;
            });

            const einnahmen = zeitraumDokumente
                .filter(d => d.typ === 'ausgangsrechnung')
                .reduce((sum, d) => sum + parseFloat(d.betrag || 0), 0);

            const ausgaben = zeitraumDokumente
                .filter(d => d.typ !== 'ausgangsrechnung')
                .reduce((sum, d) => sum + parseFloat(d.betrag || 0), 0);

            function exportCSV() {
                const headers = ['Datum', 'Absender', 'Beschreibung', 'Betrag', 'Kategorie', 'Status', 'Rechnungsnummer'];
                const rows = zeitraumDokumente.map(d => [
                    d.datum,
                    d.absender,
                    d.beschreibung,
                    d.betrag,
                    d.kategorie,
                    d.status,
                    d.rechnungsnummer || ''
                ]);
                
                const csvContent = [headers, ...rows].map(row => row.join(';')).join('\n');
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `export_${zeitraum}_${new Date().toISOString().split('T')[0]}.csv`;
                link.click();
            }

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center">
                        <h2 className="text-3xl font-bold text-gray-800">Auswertungen & Export</h2>
                        
                        <div className="flex gap-4">
                            <select value={zeitraum} onChange={(e) => setZeitraum(e.target.value)} className="px-4 py-2 border rounded">
                                <option value="monat">Aktueller Monat</option>
                                <option value="quartal">Aktuelles Quartal</option>
                                <option value="jahr">Aktuelles Jahr</option>
                            </select>
                            
                            <button
                                onClick={exportCSV}
                                className="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700"
                            >
                                📥 CSV Export ({zeitraumDokumente.length} Dok.)
                            </button>
                        </div>
                    </div>

                    <div className="grid grid-cols-3 gap-6">
                        <div className="bg-white rounded-lg shadow-md p-6">
                            <h3 className="text-lg font-semibold text-gray-700 mb-2">💰 Einnahmen</h3>
                            <p className="text-3xl font-bold text-green-600">{einnahmen.toFixed(2)} €</p>
                        </div>
                        <div className="bg-white rounded-lg shadow-md p-6">
                            <h3 className="text-lg font-semibold text-gray-700 mb-2">💸 Ausgaben</h3>
                            <p className="text-3xl font-bold text-red-600">{ausgaben.toFixed(2)} €</p>
                        </div>
                        <div className="bg-white rounded-lg shadow-md p-6">
                            <h3 className="text-lg font-semibold text-gray-700 mb-2">📊 Gewinn/Verlust</h3>
                            <p className={`text-3xl font-bold ${einnahmen - ausgaben >= 0 ? 'text-green-600' : 'text-red-600'}`}>
                                {(einnahmen - ausgaben).toFixed(2)} €
                            </p>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<BuchhaltungApp />, document.getElementById('root'));
    </script>
</body>
</html>

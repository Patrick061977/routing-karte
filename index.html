        function BuchhaltungApp() {

            async function handleFileUpload(files) {
                setUploading(true);
                const fileArray = Array.from(files);
                setUploadProgress({ current: 0, total: fileArray.length, file: '', status: 'Starte...' });
                
                for (let i = 0; i < fileArray.length; i++) {
                    const file = fileArray[i];
                    if (file.type === 'application/pdf') {
                        try {
                            setUploadProgress({ 
                                current: i + 1, 
                                total: fileArray.length, 
                                file: file.name,
                                status: 'OCR-Analyse läuft...'
                            });
                            await processPDFWithTesseract(file);
                        } catch (error) {
                            console.error(`Fehler bei ${file.name}:`, error);
                            alert(`Fehler beim Verarbeiten von ${file.name}: ${error.message}`);
                        }
                    }
                }
                
                setUploading(false);
                setUploadProgress({ current: 0, total: 0, file: '', status: '' });
                await loadData();
            }

            async function processPDFWithTesseract(file) {
                // 1. PDF hochladen zu Firebase Storage
                setUploadProgress(prev => ({ ...prev, status: 'Lade PDF hoch...' }));
                const timestamp = Date.now();
                const filename = `${timestamp}_${file.name}`;
                const storageRef = storage.ref(`pdfs/${filename}`);
                await storageRef.put(file);
                const pdfUrl = await storageRef.getDownloadURL();

                // 2. PDF zu Bildern konvertieren mit PDF.js
                setUploadProgress(prev => ({ ...prev, status: 'Konvertiere PDF zu Bildern...' }));
                const arrayBuffer = await file.arrayBuffer();
                const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
                const pdf = await loadingTask.promise;
                
                let fullText = '';
                let avgConfidence = 0;
                const pageTexts = [];

                // 3. Jede Seite mit Tesseract OCR analysieren
                for (let pageNum = 1; pageNum <= Math.min(pdf.numPages, 10); pageNum++) {
                    setUploadProgress(prev => ({ 
                        ...prev, 
                        status: `OCR-Analyse: Seite ${pageNum}/${Math.min(pdf.numPages, 10)}...` 
                    }));

                    const page = await pdf.getPage(pageNum);
                    const viewport = page.getViewport({ scale: 2.0 });
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    await page.render({
                        canvasContext: context,
                        viewport: viewport
                    }).promise;

                    // Tesseract OCR auf dem Canvas-Bild
                    const result = await Tesseract.recognize(
                        canvas,
                        'deu',
                        {
                            logger: m => {
                                if (m.status === 'recognizing text') {
                                    setUploadProgress(prev => ({ 
                                        ...prev, 
                                        status: `OCR Seite ${pageNum}: ${Math.round(m.progress * 100)}%` 
                                    }));
                                }
                            }
                        }
                    );

                    pageTexts.push(result.data.text);
                    fullText += result.data.text + '\n\n';
                    avgConfidence += result.data.confidence;
                }

                avgConfidence = avgConfidence / Math.min(pdf.numPages, 10);

                // 4. Thumbnail erstellen
                setUploadProgress(prev => ({ ...prev, status: 'Erstelle Vorschaubild...' }));
                const firstPage = await pdf.getPage(1);
                const thumbViewport = firstPage.getViewport({ scale: 0.5 });
                const thumbCanvas = document.createElement('canvas');
                const thumbContext = thumbCanvas.getContext('2d');
                thumbCanvas.height = thumbViewport.height;
                thumbCanvas.width = thumbViewport.width;
                
                await firstPage.render({
                    canvasContext: thumbContext,
                    viewport: thumbViewport
                }).promise;
                
                const thumbnailDataUrl = thumbCanvas.toDataURL('image/jpeg', 0.7);

                // 5. Intelligente Analyse des Textes
                setUploadProgress(prev => ({ ...prev, status: 'Analysiere Dokument...' }));
                const analysis = analyzeTextIntelligent(fullText, avgConfidence);

                // 6. Dokument in Firestore speichern
                setUploadProgress(prev => ({ ...prev, status: 'Speichere in Datenbank...' }));
                const dokument = {
                    dateiname: file.name,
                    pdfUrl: pdfUrl,
                    thumbnail: thumbnailDataUrl,
                    volltext: fullText.substring(0, 15000),
                    absender: analysis.absender || 'Unbekannt',
                    lieferant: analysis.absender || 'Unbekannt',

            function analyzeTextIntelligent(text, confidence) {
                const lowerText = text.toLowerCase();
                const lines = text.split('\n').filter(line => line.trim().length > 0);
                
                // KATEGORIE bestimmen (mit Priorität)
                let kategorie = 'Sonstiges';
                for (const [kat, keywords] of Object.entries(KATEGORIEN)) {
                    if (keywords.some(kw => lowerText.includes(kw))) {
                        kategorie = kat.charAt(0).toUpperCase() + kat.slice(1);
                        break; // Erste gefundene Kategorie verwenden
                    }
                }

                // ABSENDER erkennen (verbesserte Logik für Behörden)
                let absender = null;
                const behoerdenKeywords = ['hauptzollamt', 'finanzamt', 'zollamt', 'amtsgericht', 'landgericht', 'verwaltung', 'landesamt', 'bundesamt'];
                const istBehoerde = behoerdenKeywords.some(kw => lowerText.includes(kw));
                
                const potentialLines = [];
                for (let i = 0; i < Math.min(15, lines.length); i++) {
                    const line = lines[i].trim();
                    if (line.length < 3 || line.length > 100) continue;
                    if (line.match(/^\d+$/)) continue;
                    if (line.match(/^\d{1,2}\.\d{1,2}\.\d{2,4}$/)) continue;
                    if (line.toLowerCase().includes('postfach')) continue;
                    if (line.toLowerCase().includes('telefon')) continue;
                    if (line.toLowerCase().includes('e-mail')) continue;
                    if (line.toLowerCase().includes('fax')) continue;
                    
                    potentialLines.push(line);
                    if (potentialLines.length >= 4) break;
                }
                
                if (potentialLines.length > 0) {
                    if (istBehoerde && potentialLines.length >= 2) {
                        let behoerdenName = potentialLines[0];
                        for (let i = 1; i < Math.min(3, potentialLines.length); i++) {
                            const nextLine = potentialLines[i].replace(/^[-\s]+/, '').trim();
                            if (nextLine.match(/^[-A-ZÄÖÜ]/) || nextLine.length < 50) {
                                behoerdenName += ' ' + nextLine;
                            } else {
                                break;
                            }
                        }
                        absender = behoerdenName;
                    } else {
                        absender = potentialLines[0];
                    }
                }
                
                if (!absender) absender = 'Unbekannt';

                // BETRAG erkennen (mit Priorität)
                const betragPatterns = [
                    { regex: /(?:gesamt|summe|total|restforderung|gesamtbetrag)[:\s]+(\d{1,6}[,\.]\d{2})/gi, priority: 3 },
                    { regex: /(?:betrag)[:\s]+(\d{1,6}[,\.]\d{2})/gi, priority: 2 },
                    { regex: /(\d{1,6}[,\.]\d{2})\s*€/g, priority: 1 },
                    { regex: /€\s*(\d{1,6}[,\.]\d{2})/g, priority: 1 },
                ];
                
                let betrag = null;
                let allBetraege = [];
                
                for (const pattern of betragPatterns) {
                    const matches = [...text.matchAll(pattern.regex)];
                    for (const match of matches) {
                        const betragStr = match[1].replace(',', '.');
                        const betragNum = parseFloat(betragStr);
                        if (!isNaN(betragNum) && betragNum > 0 && betragNum < 1000000) {
                            allBetraege.push({ betrag: betragNum, priority: pattern.priority });
                        }
                    }
                }
                
                if (allBetraege.length > 0) {
                    allBetraege.sort((a, b) => {
                        if (a.priority !== b.priority) return b.priority - a.priority;
                        return b.betrag - a.betrag;
                    });
                    betrag = allBetraege[0].betrag;
                }

                // DATUM erkennen
                const monate = {
                    'januar': '01', 'februar': '02', 'märz': '03', 'april': '04',
                    'mai': '05', 'juni': '06', 'juli': '07', 'august': '08',
                    'september': '09', 'oktober': '10', 'november': '11', 'dezember': '12'
                };
                
                let datum = null;
                const datumPatterns = [
                    /(?:datum)[:\s]+(\d{1,2})[\.\s]+([a-zä]+)\s+(\d{4})/i,
                    /(?:datum|vom|date)[:\s]+(\d{1,2})[.\-\/](\d{1,2})[.\-\/](\d{2,4})/i,
                    /(\d{1,2})[.\-\/](\d{1,2})[.\-\/](\d{4})/,
                ];
                
                for (const pattern of datumPatterns) {
                    const match = text.match(pattern);
                    if (match) {
                        let tag, monat, jahr;
                        if (match[2] && isNaN(match[2])) {
                            tag = match[1].padStart(2, '0');
                            monat = monate[match[2].toLowerCase()] || '01';
                            jahr = match[3];
                        } else {
                            tag = match[1].padStart(2, '0');
                            monat = match[2].padStart(2, '0');
                            jahr = match[3];
                            if (jahr.length === 2) jahr = '20' + jahr;
                        }
                        
                        if (parseInt(monat) >= 1 && parseInt(monat) <= 12 && parseInt(tag) >= 1 && parseInt(tag) <= 31) {
                            datum = `${jahr}-${monat}-${tag}`;
                            break;
                        }
                    }
                }

                // RECHNUNGSNUMMER
                const rechnungsNrPatterns = [
                    /(?:GZ|Geschäftszeichen)[:\s]+([A-Z0-9\-\/\s]+?)(?:\s|$)/i,
                    /Rechnung[s]?[-\s]*(?:Nr\.?|nummer)?[:\s]+([A-Z0-9\-\/]+)/i,
                    /(?:Beleg|Dok)[.-]?(?:Nr\.?)?[:\s]+([A-Z0-9\-\/]+)/i,
                ];
                
                let rechnungsnummer = null;
                for (const pattern of rechnungsNrPatterns) {
                    const match = text.match(pattern);
                    if (match && match[1].trim().length >= 3 && match[1].trim().length <= 40) {
                        rechnungsnummer = match[1].trim().replace(/\s+/g, ' ');
                        break;
                    }
                }

                // FÄLLIGKEITSDATUM
                let faelligkeitsdatum = null;
                if (datum) {
                    const d = new Date(datum);
                    d.setDate(d.getDate() + 14);
                    faelligkeitsdatum = d.toISOString().split('T')[0];
                }

                // ZUSAMMENFASSUNG erstellen (erste 3 Sätze)
                const saetze = text.match(/[^.!?]+[.!?]+/g) || [];
                const zusammenfassung = saetze.slice(0, 3).join(' ').trim().substring(0, 300);

                // WICHTIGE PUNKTE extrahieren
                const wichtigePunkte = [];
                if (betrag) wichtigePunkte.push(`Betrag: ${betrag.toFixed(2)} €`);
                if (rechnungsnummer) wichtigePunkte.push(`Rechnungs-Nr: ${rechnungsnummer}`);
                if (faelligkeitsdatum) wichtigePunkte.push(`Fällig am: ${new Date(faelligkeitsdatum).toLocaleDateString('de-DE')}`);
                if (lowerText.includes('mahnung')) wichtigePunkte.push('⚠️ Mahnung');
                if (lowerText.includes('überfällig')) wichtigePunkte.push('⚠️ Überfällig');
                if (lowerText.includes('dringend')) wichtigePunkte.push('⚠️ Dringend');

                const beschreibung = `${kategorie} - ${absender}`;

                return {
                    absender,
                    betrag,
                    datum,
                    rechnungsnummer,
                    kategorie,
                    faelligkeitsdatum,
                    beschreibung,
                    zusammenfassung,
                    wichtigePunkte
                };
            }

                        await db.collection('dokumente').doc(id).delete();
                        await loadData();

                let aVal, bVal;
                
                switch(sortBy) {
                    case 'datum':
                        aVal = new Date(a.datum || 0);
                        bVal = new Date(b.datum || 0);
                        break;
                    case 'betrag':
                        aVal = parseFloat(a.betrag || 0);
                        bVal = parseFloat(b.betrag || 0);
                        break;
                    case 'absender':
                        aVal = (a.absender || '').toLowerCase();
                        bVal = (b.absender || '').toLowerCase();
                        break;
                    case 'status':
                        aVal = a.status || '';
                        bVal = b.status || '';
                        break;
                    default:
                        return 0;
                }
                
                if (sortOrder === 'asc') {
                    return aVal > bVal ? 1 : -1;
                } else {
                    return aVal < bVal ? 1 : -1;
                }
            });

            // Statistiken
            const stats = {
                gesamt: dokumente.length,
                offen: dokumente.filter(d => d.status === 'offen').length,
                bearbeitet: dokumente.filter(d => d.status === 'bearbeitet').length,
                bezahlt: dokumente.filter(d => d.status === 'bezahlt').length,
                gebucht: dokumente.filter(d => d.status === 'gebucht').length,
                ueberfaellig: dokumente.filter(d => {
                    if (!d.faelligkeitsdatum && !d.faelligAm) return false;
                    if (d.status === 'bezahlt' || d.status === 'gebucht') return false;
                    const faellig = d.faelligkeitsdatum || d.faelligAm;
                    return new Date(faellig) < new Date();
                }).length,
                offeneBetrag: dokumente
                    .filter(d => d.status === 'offen' && d.betrag)

            };

            if (loading) {

                            <p className="text-xl text-gray-600">Lade Daten aus Firebase...</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen">
                    {/* Header */}
                    <header className="datev-blue text-white shadow-lg">
                        <div className="container mx-auto px-6 py-4">
                            <div className="flex justify-between items-center">
                                <div>
                                    <h1 className="text-2xl font-bold">🚕 Funk Taxi Heringsdorf</h1>
                                    <p className="text-blue-200 text-sm">Premium Buchhaltungssoftware v{VERSION} • Tesseract OCR</p>
                                </div>
                                <div className="text-right">
                                    <div className="flex items-center gap-2 mb-1">
                                        <span className="bg-green-500 w-2 h-2 rounded-full animate-pulse"></span>
                                        <span className="text-xs text-green-200">Firebase Cloud verbunden</span>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <span className="bg-purple-500 px-2 py-1 rounded text-xs font-semibold">v{VERSION}</span>
                                        <span className="text-xs text-blue-200">Premium OCR</span>
                                    </div>
                                    <p className="text-sm text-blue-200">{new Date().toLocaleDateString('de-DE', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</p>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Navigation */}
                    <nav className="bg-white shadow-md border-b-2">
                        <div className="container mx-auto px-6">
                            <div className="flex space-x-1">
                                {[
                                    { id: 'dashboard', name: 'Dashboard', icon: '📊' },
                                    { id: 'dokumente', name: 'Dokumente', icon: '📁' },
                                    { id: 'kontierung', name: 'Kontierung', icon: '🔢' },
                                    { id: 'auswertungen', name: 'Auswertungen', icon: '📈' },
                                ].map(tab => (
                                    <button
                                        key={tab.id}
                                        onClick={() => setActiveTab(tab.id)}

                                                : 'text-gray-600 hover:bg-gray-100'

                        {activeTab === 'dokumente' && (

                                setSearchTerm={setSearchTerm}

                                setStatusFilter={setStatusFilter}
                                sortBy={sortBy}
                                setSortBy={setSortBy}
                                sortOrder={sortOrder}
                                setSortOrder={setSortOrder}
                                updateStatus={updateStatus}
                                updateDokument={updateDokument}
                                deleteDokument={deleteDokument}

                                uploadProgress={uploadProgress}

                                setSelectedDokument={setSelectedDokument}

                        {activeTab === 'kontierung' && (

                        {activeTab === 'auswertungen' && (
                            <AuswertungenView dokumente={dokumente} />
                        )}
                    </main>

            );
        }

        function Dashboard({ stats, dokumente, version }) {
            const aktuellerMonat = new Date().getMonth();
            const aktuellesJahr = new Date().getFullYear();
            const monatsDokumente = dokumente.filter(d => {
                const datum = new Date(d.datum);
                return datum.getMonth() === aktuellerMonat && datum.getFullYear() === aktuellesJahr;
            });

            const monatsEinnahmen = monatsDokumente
                .filter(d => d.typ === 'ausgangsrechnung')
                .reduce((sum, d) => sum + (parseFloat(d.betrag) || 0), 0);

            const monatsAusgaben = monatsDokumente
                .filter(d => d.typ === 'eingangsrechnung' || d.typ === 'tankbeleg' || d.typ === 'quittung')
                .reduce((sum, d) => sum + (parseFloat(d.betrag) || 0), 0);

            const hochprioDokumente = dokumente
                .filter(d => {
                    if (d.status === 'bezahlt' || d.status === 'gebucht') return false;
                    const faellig = d.faelligkeitsdatum || d.faelligAm;
                    const istUeberfaellig = faellig && new Date(faellig) < new Date();
                    return istUeberfaellig || d.prioritaet === 'hoch';
                })
                .sort((a, b) => new Date(a.faelligkeitsdatum || a.faelligAm || a.datum) - new Date(b.faelligkeitsdatum || b.faelligAm || b.datum))
                .slice(0, 10);

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center">
                        <h2 className="text-3xl font-bold text-gray-800">Dashboard</h2>
                        <div className="bg-purple-100 px-4 py-2 rounded-lg border border-purple-300">
                            <p className="text-sm text-purple-800 font-semibold">🚀 Version {version} - Premium OCR</p>
                        </div>
                    </div>
                    
                    {/* Status Cards */}
                    <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4">
                        <StatCard title="Gesamt" value={stats.gesamt} icon="📋" color="bg-blue-500" />
                        <StatCard title="Offen" value={stats.offen} icon="⏳" color="bg-yellow-500" />
                        <StatCard title="Bearbeitet" value={stats.bearbeitet} icon="✏️" color="bg-orange-500" />
                        <StatCard title="Bezahlt" value={stats.bezahlt} icon="✅" color="bg-green-500" />
                        <StatCard title="Überfällig" value={stats.ueberfaellig} icon="⚠️" color="bg-red-500" />
                        <div className="bg-white rounded-lg shadow-md p-4 border-l-4 border-purple-500">
                            <p className="text-gray-600 text-xs font-medium">Offene Summe</p>
                            <p className="text-xl font-bold text-purple-600">{stats.offeneBetrag.toFixed(2)} €</p>
                        </div>
                    </div>

                    {/* Monatsübersicht */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="bg-white rounded-lg shadow-md p-6">
                            <h3 className="text-lg font-semibold text-gray-700 mb-2">💰 Einnahmen (aktueller Monat)</h3>
                            <p className="text-3xl font-bold text-green-600">{monatsEinnahmen.toFixed(2)} €</p>
                        </div>
                        <div className="bg-white rounded-lg shadow-md p-6">
                            <h3 className="text-lg font-semibold text-gray-700 mb-2">💸 Ausgaben (aktueller Monat)</h3>
                            <p className="text-3xl font-bold text-red-600">{monatsAusgaben.toFixed(2)} €</p>
                        </div>
                        <div className="bg-white rounded-lg shadow-md p-6">
                            <h3 className="text-lg font-semibold text-gray-700 mb-2">📊 Gewinn (aktueller Monat)</h3>
                            <p className={`text-3xl font-bold ${monatsEinnahmen - monatsAusgaben >= 0 ? 'text-green-600' : 'text-red-600'}`}>
                                {(monatsEinnahmen - monatsAusgaben).toFixed(2)} €
                            </p>
                        </div>
                    </div>

                    {/* Dringende Dokumente */}
                    {hochprioDokumente.length > 0 && (
                        <div className="bg-white rounded-lg shadow-md p-6">
                            <h3 className="text-xl font-bold text-gray-800 mb-4">🔥 Dringende & Überfällige Dokumente</h3>
                            <div className="space-y-3">
                                {hochprioDokumente.map(dok => {
                                    const faellig = dok.faelligkeitsdatum || dok.faelligAm;
                                    const istUeberfaellig = faellig && new Date(faellig) < new Date();
                                    return (
                                        <div key={dok.id} className={`flex justify-between items-center p-3 rounded ${istUeberfaellig ? 'bg-red-50 border-l-4 border-red-600' : 'bg-yellow-50 border-l-4 border-yellow-500'}`}>
                                            <div>
                                                <p className="font-semibold">{dok.beschreibung || dok.absender}</p>
                                                <p className="text-sm text-gray-600">
                                                    {dok.betrag ? `${parseFloat(dok.betrag).toFixed(2)} €` : ''} • {new Date(dok.datum).toLocaleDateString('de-DE')}
                                                    {faellig && ` • Fällig: ${new Date(faellig).toLocaleDateString('de-DE')}`}
                                                    {istUeberfaellig && <span className="ml-2 text-red-600 font-bold">⚠️ ÜBERFÄLLIG</span>}
                                                </p>
                                            </div>
                                            <span className={`px-3 py-1 rounded text-sm font-medium status-${dok.status}`}>
                                                {dok.status}
                                            </span>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function StatCard({ title, value, icon, color }) {
            return (
                <div className="bg-white rounded-lg shadow-md p-4">
                    <div className="flex justify-between items-center">
                        <div>
                            <p className="text-gray-600 text-xs font-medium">{title}</p>
                            <p className="text-2xl font-bold text-gray-800 mt-1">{value}</p>
                        </div>
                        <div className={`${color} w-12 h-12 rounded-full flex items-center justify-center text-xl text-white`}>
                            {icon}
                        </div>
                    </div>
                </div>
            );
        }

        function DokumenteView({ dokumente, ordner, selectedOrdner, setSelectedOrdner, searchTerm, setSearchTerm, statusFilter, setStatusFilter, sortBy, setSortBy, sortOrder, setSortOrder, updateStatus, updateDokument, deleteDokument, handleFileUpload, uploading, uploadProgress, selectedDokument, setSelectedDokument }) {
            const filteredDokumente = dokumente.filter(dok => {
                const matchOrdner = selectedOrdner === 'alle' || dok.absender === selectedOrdner || dok.lieferant === selectedOrdner;
                const matchSearch = searchTerm === '' || 
                    dok.absender?.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    dok.lieferant?.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    dok.beschreibung?.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    dok.dateiname?.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    dok.volltext?.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    dok.rechnungsnummer?.toLowerCase().includes(searchTerm.toLowerCase());
                const matchStatus = statusFilter === 'alle' || dok.status === statusFilter;
                
                return matchOrdner && matchSearch && matchStatus;
            });

            return (
                <div className="flex gap-6">
                    {/* Sidebar - Ordner */}
                    <div className="w-64 bg-white rounded-lg shadow-md p-4 h-fit">
                        <h2 className="font-bold text-gray-800 mb-3">📁 Ordner</h2>
                        
                        <button
                            onClick={() => setSelectedOrdner('alle')}
                            className={`w-full text-left px-3 py-2 rounded mb-1 text-sm ${selectedOrdner === 'alle' ? 'folder-active font-semibold' : 'hover:bg-gray-100'}`}
                        >
                            📂 Alle ({dokumente.length})
                        </button>

                        <div className="space-y-1 mt-3">
                            {ordner.map(ord => {
                                const count = dokumente.filter(d => d.absender === ord || d.lieferant === ord).length;
                                const offeneCount = dokumente.filter(d => (d.absender === ord || d.lieferant === ord) && d.status === 'offen').length;
                                return (
                                    <button
                                        key={ord}
                                        onClick={() => setSelectedOrdner(ord)}
                                        className={`w-full text-left px-3 py-2 rounded text-sm ${selectedOrdner === ord ? 'folder-active font-semibold' : 'hover:bg-gray-100'}`}
                                    >
                                        <div className="flex justify-between items-center">
                                            <span className="truncate text-xs">📄 {ord}</span>
                                            <div className="flex gap-1">
                                                <span className="bg-gray-200 px-1.5 py-0.5 rounded text-xs">{count}</span>
                                                {offeneCount > 0 && (
                                                    <span className="bg-red-500 text-white px-1.5 py-0.5 rounded text-xs">{offeneCount}</span>
                                                )}
                                            </div>
                                        </div>
                                    </button>
                                );
                            })}
                        </div>
                    </div>

                    {/* Hauptbereich */}
                    <div className="flex-1 space-y-6">
                        <h2 className="text-3xl font-bold text-gray-800">Dokumentenverwaltung</h2>

                        {/* Upload Zone */}
                        <UploadZone onUpload={handleFileUpload} uploading={uploading} uploadProgress={uploadProgress} />

                        {/* Suche, Filter & Sortierung */}
                        <div className="flex gap-4 flex-wrap">
                            <input
                                type="text"
                                placeholder="🔍 Volltext-Suche..."
                                value={searchTerm}
                                onChange={(e) => setSearchTerm(e.target.value)}
                                className="flex-1 px-4 py-2 border rounded-lg"
                            />
                            <select
                                value={statusFilter}
                                onChange={(e) => setStatusFilter(e.target.value)}
                                className="px-4 py-2 border rounded-lg"
                            >
                                <option value="alle">Alle Status</option>
                                <option value="offen">Offen</option>
                                <option value="bearbeitet">Bearbeitet</option>
                                <option value="bezahlt">Bezahlt</option>
                                <option value="gebucht">Gebucht</option>
                            </select>
                            
                            <select
                                value={sortBy}
                                onChange={(e) => setSortBy(e.target.value)}
                                className="px-4 py-2 border rounded-lg"
                            >
                                <option value="datum">Sortieren: Datum</option>
                                <option value="betrag">Sortieren: Betrag</option>
                                <option value="absender">Sortieren: Absender</option>
                                <option value="status">Sortieren: Status</option>
                            </select>
                            
                            <button
                                onClick={() => setSortOrder(sortOrder === 'desc' ? 'asc' : 'desc')}
                                className="px-4 py-2 bg-gray-200 rounded-lg hover:bg-gray-300"
                            >
                                {sortOrder === 'desc' ? '⬇️' : '⬆️'}
                            </button>
                        </div>

                        <p className="text-sm text-gray-600">
                            Zeige {filteredDokumente.length} von {dokumente.length} Dokumenten
                        </p>

                        {/* Dokumente */}
                        <div className="space-y-3">
                            {filteredDokumente.length === 0 ? (
                                <div className="bg-white rounded-lg shadow-md p-12 text-center">
                                    <p className="text-gray-500">Keine Dokumente gefunden</p>
                                </div>
                            ) : (
                                filteredDokumente.map(dok => (
                                    <DokumentCard 
                                        key={dok.id}
                                        dokument={dok}
                                        updateStatus={updateStatus}
                                        updateDokument={updateDokument}
                                        deleteDokument={deleteDokument}
                                        setSelectedDokument={setSelectedDokument}
                                    />
                                ))
                            )}
                        </div>
                    </div>

                    {/* PDF Viewer */}
                    {selectedDokument && (
                        <PDFViewer dokument={selectedDokument} onClose={() => setSelectedDokument(null)} />
                    )}
                </div>
            );
        }

        function UploadZone({ onUpload, uploading, uploadProgress }) {
            const fileInputRef = useRef(null);
            const [dragOver, setDragOver] = useState(false);

            return (
                <div
                    className={`border-2 border-dashed rounded-lg p-8 text-center cursor-pointer transition-colors ${
                        dragOver ? 'drag-over' : 'border-gray-300 bg-white hover:border-blue-400'
                    }`}
                    onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
                    onDragLeave={() => setDragOver(false)}
                    onDrop={(e) => { 
                        e.preventDefault(); 
                        setDragOver(false);
                        if (e.dataTransfer.files.length > 0) onUpload(e.dataTransfer.files);
                    }}
                    onClick={() => !uploading && fileInputRef.current?.click()}
                >
                    <input
                        ref={fileInputRef}
                        type="file"
                        multiple
                        accept="application/pdf"
                        onChange={(e) => { if (e.target.files.length > 0) onUpload(e.target.files); }}
                        className="hidden"
                    />
                    
                    {uploading ? (
                        <div>
                            <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-purple-600 mx-auto mb-3"></div>
                            <p className="text-lg font-semibold text-purple-600 mb-2">{uploadProgress.status}</p>
                            <p className="text-sm text-gray-600 mb-2">{uploadProgress.file}</p>
                            <div className="w-full bg-gray-200 rounded-full h-2.5 mb-2">
                                <div 
                                    className="bg-purple-600 h-2.5 rounded-full transition-all duration-300" 
                                    style={{ width: `${(uploadProgress.current / uploadProgress.total) * 100}%` }}
                                ></div>
                            </div>
                            <p className="text-xs text-gray-500">Datei {uploadProgress.current} von {uploadProgress.total}</p>
                        </div>
                    ) : (
                        <div>
                            <div className="text-5xl mb-3">📤</div>
                            <p className="text-lg font-semibold text-gray-700">PDFs hochladen</p>
                            <p className="text-sm text-gray-500">Drag & Drop oder Klicken</p>
                            <p className="text-xs text-purple-600 font-semibold mt-2">🚀 Premium Tesseract OCR • 99% Genauigkeit</p>
                        </div>
                    )}
                </div>
            );
        }

        function DokumentCard({ dokument, updateStatus, updateDokument, deleteDokument, setSelectedDokument }) {
            const [showText, setShowText] = useState(false);
            const [editing, setEditing] = useState(false);
            const [editData, setEditData] = useState({
                absender: dokument.absender || '',
                betrag: dokument.betrag || 0,
                datum: dokument.datum || '',
                rechnungsnummer: dokument.rechnungsnummer || '',
                kategorie: dokument.kategorie || 'Sonstiges',
                beschreibung: dokument.beschreibung || '',
            });

            const faellig = dokument.faelligkeitsdatum || dokument.faelligAm;
            const istUeberfaellig = faellig && new Date(faellig) < new Date() && dokument.status === 'offen';
            const textVorschau = dokument.zusammenfassung || (dokument.volltext ? dokument.volltext.substring(0, 200).trim() + '...' : null);
            
            // OCR Confidence Badge
            const confidence = dokument.ocrConfidence || 0;
            let confidenceClass = 'confidence-low';
            let confidenceText = 'Niedrig';
            if (confidence >= 90) {
                confidenceClass = 'confidence-high';
                confidenceText = 'Hoch';
            } else if (confidence >= 70) {
                confidenceClass = 'confidence-medium';
                confidenceText = 'Mittel';
            }

            async function saveEdit() {
                try {
                    await db.collection('dokumente').doc(dokument.id).update({
                        absender: editData.absender,
                        lieferant: editData.absender,
                        betrag: parseFloat(editData.betrag),
                        datum: editData.datum,
                        rechnungsnummer: editData.rechnungsnummer,
                        belegnummer: editData.rechnungsnummer,
                        kategorie: editData.kategorie,
                        beschreibung: editData.beschreibung,
                    });
                    setEditing(false);
                    window.location.reload();
                } catch (error) {
                    console.error('Fehler beim Speichern:', error);
                    alert('Fehler beim Speichern');
                }
            }

            return (
                <div className={`bg-white rounded-lg shadow-md p-4 ${istUeberfaellig ? 'border-l-4 border-red-600' : ''}`}>
                    <div className="flex justify-between items-start gap-4">
                        {/* Thumbnail */}
                        {dokument.thumbnail && (
                            <img 
                                src={dokument.thumbnail} 
                                alt="PDF Vorschau" 
                                className="w-16 h-20 object-cover rounded border cursor-pointer hover:opacity-75"
                                onClick={() => setSelectedDokument(dokument)}
                            />
                        )}
                        
                        <div className="flex-1">
                            <div className="flex items-center gap-2 mb-2">
                                <h3 className="font-bold text-lg">{dokument.beschreibung || dokument.absender || dokument.dateiname}</h3>
                                {dokument.ocrConfidence && (
                                    <span className={`px-2 py-1 rounded text-xs font-semibold ${confidenceClass}`}>
                                        OCR: {Math.round(confidence)}%
                                    </span>
                                )}
                            </div>
                            
                            <div className="flex gap-4 mt-2 text-sm text-gray-600 flex-wrap">
                                {dokument.betrag && <span className="font-bold text-lg text-gray-800">{parseFloat(dokument.betrag).toFixed(2)} €</span>}
                                {dokument.datum && <span>📅 {new Date(dokument.datum).toLocaleDateString('de-DE')}</span>}
                                {dokument.rechnungsnummer && <span>#️⃣ {dokument.rechnungsnummer}</span>}
                                {dokument.kategorie && <span className="px-2 py-1 bg-blue-100 text-blue-700 rounded text-xs">{dokument.kategorie}</span>}
                                {istUeberfaellig && <span className="text-red-600 font-bold">⚠️ ÜBERFÄLLIG</span>}
                            </div>
                            
                            {/* Wichtige Punkte */}
                            {dokument.wichtigePunkte && dokument.wichtigePunkte.length > 0 && (
                                <div className="mt-2 flex flex-wrap gap-2">
                                    {dokument.wichtigePunkte.map((punkt, idx) => (
                                        <span key={idx} className="text-xs bg-yellow-100 text-yellow-800 px-2 py-1 rounded">
                                            {punkt}
                                        </span>
                                    ))}
                                </div>
                            )}
                            
                            {/* Zusammenfassung */}
                            {textVorschau && !showText && (
                                <div className="mt-3 p-3 bg-gray-50 rounded border border-gray-200">
                                    <p className="text-xs font-semibold text-gray-700 mb-1">📝 Zusammenfassung:</p>
                                    <p className="text-xs text-gray-600 italic">{textVorschau}</p>
                                </div>
                            )}
                            
                            {/* Volltext */}
                            {showText && dokument.volltext && (
                                <div className="mt-3 p-4 bg-gray-50 rounded border border-gray-300 max-h-96 overflow-y-auto">
                                    <h4 className="font-semibold text-sm mb-2">Extrahierter Text (Tesseract OCR):</h4>
                                    <pre className="text-xs text-gray-700 whitespace-pre-wrap font-mono">{dokument.volltext}</pre>
                                </div>
                            )}
                        </div>
                        
                        <div className="flex gap-2 flex-wrap">
                            <select
                                value={dokument.status}
                                onChange={(e) => updateStatus(dokument.id, e.target.value)}
                                className={`px-3 py-1 rounded text-sm status-${dokument.status}`}
                            >
                                <option value="offen">Offen</option>
                                <option value="bearbeitet">Bearbeitet</option>
                                <option value="bezahlt">Bezahlt</option>
                                <option value="gebucht">Gebucht</option>
                            </select>
                            
                            <button
                                onClick={() => setShowText(!showText)}
                                className="px-3 py-1 bg-purple-500 text-white rounded text-sm hover:bg-purple-600"
                            >
                                📄 {showText ? 'Verstecken' : 'Text'}
                            </button>
                            
                            <button
                                onClick={() => setEditing(true)}
                                className="px-3 py-1 bg-orange-500 text-white rounded text-sm hover:bg-orange-600"
                            >
                                ✏️
                            </button>
                            
                            {dokument.pdfUrl && (
                                <>
                                    <button
                                        onClick={() => setSelectedDokument(dokument)}
                                        className="px-3 py-1 bg-blue-500 text-white rounded text-sm hover:bg-blue-600"
                                    >
                                        👁️
                                    </button>
                                    <a
                                        href={dokument.pdfUrl}
                                        download
                                        className="px-3 py-1 bg-green-500 text-white rounded text-sm hover:bg-green-600"
                                        onClick={(e) => e.stopPropagation()}
                                    >
                                        📥
                                    </a>
                                </>
                            )}
                            
                            <button
                                onClick={() => deleteDokument(dokument.id, dokument.pdfUrl)}
                                className="px-3 py-1 bg-red-500 text-white rounded text-sm hover:bg-red-600"
                            >
                                🗑️
                            </button>
                        </div>
                    </div>

                    {/* Bearbeiten-Modal */}
                    {editing && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-lg p-6 max-w-2xl w-full">
                                <h3 className="text-xl font-bold mb-4">Dokument bearbeiten</h3>
                                
                                <div className="space-y-4">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-sm font-medium mb-1">Absender/Firma</label>
                                            <input
                                                type="text"
                                                value={editData.absender}
                                                onChange={(e) => setEditData({...editData, absender: e.target.value})}
                                                className="w-full p-2 border rounded"
                                            />
                                        </div>
                                        
                                        <div>
                                            <label className="block text-sm font-medium mb-1">Betrag (€)</label>
                                            <input
                                                type="number"
                                                step="0.01"
                                                value={editData.betrag}
                                                onChange={(e) => setEditData({...editData, betrag: e.target.value})}
                                                className="w-full p-2 border rounded"
                                            />
                                        </div>
                                    </div>
                                    
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-sm font-medium mb-1">Datum</label>
                                            <input
                                                type="date"
                                                value={editData.datum}
                                                onChange={(e) => setEditData({...editData, datum: e.target.value})}
                                                className="w-full p-2 border rounded"
                                            />
                                        </div>
                                        
                                        <div>
                                            <label className="block text-sm font-medium mb-1">Rechnungsnummer</label>
                                            <input
                                                type="text"
                                                value={editData.rechnungsnummer}
                                                onChange={(e) => setEditData({...editData, rechnungsnummer: e.target.value})}
                                                className="w-full p-2 border rounded"
                                            />
                                        </div>
                                    </div>
                                    
                                    <div>
                                        <label className="block text-sm font-medium mb-1">Kategorie</label>
                                        <select
                                            value={editData.kategorie}
                                            onChange={(e) => setEditData({...editData, kategorie: e.target.value})}
                                            className="w-full p-2 border rounded"
                                        >
                                            <option value="Steuer">Steuer</option>
                                            <option value="Treibstoff">Treibstoff</option>
                                            <option value="Versicherung">Versicherung</option>
                                            <option value="Reparatur">Reparatur</option>
                                            <option value="Miete">Miete</option>
                                            <option value="Telekom">Telekom</option>
                                            <option value="Strom">Strom</option>
                                            <option value="Sonstiges">Sonstiges</option>
                                        </select>
                                    </div>
                                    
                                    <div>
                                        <label className="block text-sm font-medium mb-1">Beschreibung</label>
                                        <input
                                            type="text"
                                            value={editData.beschreibung}
                                            onChange={(e) => setEditData({...editData, beschreibung: e.target.value})}
                                            className="w-full p-2 border rounded"
                                        />
                                    </div>
                                </div>
                                
                                <div className="flex gap-3 mt-6">
                                    <button
                                        onClick={saveEdit}
                                        className="flex-1 bg-blue-600 text-white py-2 rounded hover:bg-blue-700"
                                    >
                                        💾 Speichern
                                    </button>
                                    <button
                                        onClick={() => setEditing(false)}
                                        className="flex-1 bg-gray-300 text-gray-800 py-2 rounded hover:bg-gray-400"
                                    >
                                        Abbrechen
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function PDFViewer({ dokument, onClose }) {
            return (
                <div className="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50 p-4" onClick={onClose}>
                    <div className="bg-white rounded-lg w-full max-w-6xl h-[90vh] flex flex-col" onClick={(e) => e.stopPropagation()}>
                        <div className="flex justify-between items-center p-4 border-b bg-gray-50">
                            <div>
                                <h3 className="font-bold text-lg">{dokument.dateiname}</h3>
                                {dokument.beschreibung && (
                                    <p className="text-sm text-gray-600">{dokument.beschreibung}</p>
                                )}
                            </div>
                            <button
                                onClick={onClose}
                                className="text-gray-600 hover:text-gray-800 text-3xl font-bold px-3"
                            >
                                ✕
                            </button>
                        </div>
                        
                        <div className="flex-1 overflow-hidden bg-gray-100">
                            <iframe
                                src={`${dokument.pdfUrl}#toolbar=1&navpanes=1&scrollbar=1`}
                                className="w-full h-full border-0"
                                title="PDF Viewer"
                                style={{ minHeight: '600px' }}
                            />
                        </div>
                        
                        <div className="p-3 border-t bg-gray-50 flex justify-between items-center">
                            <div className="text-sm text-gray-600">
                                {dokument.betrag && <span className="font-semibold">{parseFloat(dokument.betrag).toFixed(2)} €</span>}
                                {dokument.datum && <span className="ml-4">📅 {new Date(dokument.datum).toLocaleDateString('de-DE')}</span>}
                                {dokument.kategorie && <span className="ml-4 px-2 py-1 bg-blue-100 text-blue-700 rounded text-xs">{dokument.kategorie}</span>}
                                {dokument.ocrConfidence && <span className="ml-4 px-2 py-1 bg-green-100 text-green-700 rounded text-xs">OCR: {Math.round(dokument.ocrConfidence)}%</span>}
                            </div>
                            <a
                                href={dokument.pdfUrl}
                                target="_blank"
                                rel="noopener noreferrer"
                                className="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700"
                            >
                                📥 Download
                            </a>
                        </div>
                    </div>
                </div>
            );
        }

        function KontierungView({ dokumente, updateDokument }) {
            const ungebuchte = dokumente.filter(d => d.status !== 'gebucht' && !d.konto);

            return (
                <div className="space-y-6">
                    <h2 className="text-3xl font-bold text-gray-800">DATEV-Kontierung (SKR03)</h2>
                    
                    {ungebuchte.length === 0 ? (
                        <div className="bg-white rounded-lg shadow-md p-12 text-center">
                            <p className="text-gray-500 text-lg">✅ Alle Dokumente sind kontiert!</p>
                        </div>
                    ) : (
                        <div className="space-y-4">
                            {ungebuchte.map(dok => (
                                <KontierungCard key={dok.id} dokument={dok} updateDokument={updateDokument} />
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        function KontierungCard({ dokument, updateDokument }) {
            const [konto, setKonto] = useState(dokument.konto || '');
            const istEinnahme = dokument.typ === 'ausgangsrechnung';
            const konten = istEinnahme ? KONTENRAHMEN.einnahmen : KONTENRAHMEN.ausgaben;

            function speichern() {
                if (!konto) {
                    alert('Bitte Konto wählen');
                    return;
                }
                updateDokument(dokument.id, { konto, status: 'bearbeitet' });
            }

            return (
                <div className="bg-white rounded-lg shadow-md p-6 grid grid-cols-2 gap-6">
                    <div>
                        <h3 className="font-bold text-lg mb-2">{dokument.beschreibung || dokument.absender}</h3>
                        <p className="text-sm text-gray-600">Betrag: <strong>{parseFloat(dokument.betrag || 0).toFixed(2)} €</strong></p>
                        <p className="text-sm text-gray-600">Datum: {new Date(dokument.datum).toLocaleDateString('de-DE')}</p>
                    </div>
                    
                    <div>
                        <label className="block text-sm font-medium mb-2">DATEV-Konto:</label>
                        <select value={konto} onChange={(e) => setKonto(e.target.value)} className="w-full p-2 border rounded mb-3">
                            <option value="">-- Konto wählen --</option>
                            {konten.map(k => (
                                <option key={k.konto} value={k.konto}>{k.konto} - {k.bezeichnung}</option>
                            ))}
                        </select>
                        <button onClick={speichern} className="w-full datev-blue text-white py-2 rounded">
                            💾 Speichern
                        </button>
                    </div>
                </div>
            );
        }

        function AuswertungenView({ dokumente }) {
            const [zeitraum, setZeitraum] = useState('monat');
            
            const jetzt = new Date();
            let startDatum, endDatum;
            
            if (zeitraum === 'monat') {
                startDatum = new Date(jetzt.getFullYear(), jetzt.getMonth(), 1);
                endDatum = new Date(jetzt.getFullYear(), jetzt.getMonth() + 1, 0);
            } else if (zeitraum === 'quartal') {
                const quartal = Math.floor(jetzt.getMonth() / 3);
                startDatum = new Date(jetzt.getFullYear(), quartal * 3, 1);
                endDatum = new Date(jetzt.getFullYear(), (quartal + 1) * 3, 0);
            } else {
                startDatum = new Date(jetzt.getFullYear(), 0, 1);
                endDatum = new Date(jetzt.getFullYear(), 11, 31);
            }

            const zeitraumDokumente = dokumente.filter(d => {
                const datum = new Date(d.datum);
                return datum >= startDatum && datum <= endDatum;
            });

            const einnahmen = zeitraumDokumente
                .filter(d => d.typ === 'ausgangsrechnung')
                .reduce((sum, d) => sum + parseFloat(d.betrag || 0), 0);

            const ausgaben = zeitraumDokumente
                .filter(d => d.typ !== 'ausgangsrechnung')
                .reduce((sum, d) => sum + parseFloat(d.betrag || 0), 0);

            function exportCSV() {
                const headers = ['Datum', 'Absender', 'Beschreibung', 'Betrag', 'Kategorie', 'Status', 'Rechnungsnummer'];
                const rows = zeitraumDokumente.map(d => [
                    d.datum,
                    d.absender,
                    d.beschreibung,
                    d.betrag,
                    d.kategorie,
                    d.status,
                    d.rechnungsnummer || ''
                ]);
                
                const csvContent = [headers, ...rows].map(row => row.join(';')).join('\n');
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `export_${zeitraum}_${new Date().toISOString().split('T')[0]}.csv`;
                link.click();
            }

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center">
                        <h2 className="text-3xl font-bold text-gray-800">Auswertungen & Export</h2>
                        
                        <div className="flex gap-4">
                            <select value={zeitraum} onChange={(e) => setZeitraum(e.target.value)} className="px-4 py-2 border rounded">
                                <option value="monat">Aktueller Monat</option>
                                <option value="quartal">Aktuelles Quartal</option>
                                <option value="jahr">Aktuelles Jahr</option>
                            </select>
                            
                            <button
                                onClick={exportCSV}
                                className="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700"
                            >
                                📥 CSV Export ({zeitraumDokumente.length} Dok.)
                            </button>
                        </div>
                    </div>

                    <div className="grid grid-cols-3 gap-6">
                        <div className="bg-white rounded-lg shadow-md p-6">
                            <h3 className="text-lg font-semibold text-gray-700 mb-2">💰 Einnahmen</h3>
                            <p className="text-3xl font-bold text-green-600">{einnahmen.toFixed(2)} €</p>
                        </div>
                        <div className="bg-white rounded-lg shadow-md p-6">
                            <h3 className="text-lg font-semibold text-gray-700 mb-2">💸 Ausgaben</h3>
                            <p className="text-3xl font-bold text-red-600">{ausgaben.toFixed(2)} €</p>
                        </div>
                        <div className="bg-white rounded-lg shadow-md p-6">
                            <h3 className="text-lg font-semibold text-gray-700 mb-2">📊 Gewinn/Verlust</h3>
                            <p className={`text-3xl font-bold ${einnahmen - ausgaben >= 0 ? 'text-green-600' : 'text-red-600'}`}>
                                {(einnahmen - ausgaben).toFixed(2)} €
                            </p>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<BuchhaltungApp />, document.getElementById('root'));
    </script>
</body>
</html>

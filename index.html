                                            <span className="bg-blue-100 text-blue-700 px-2 py-0.5 rounded text-xs font-semibold">
                                                {schritt.klicks === 0 ? 'Automatisch' : `${schritt.klicks} Klick${schritt.klicks !== 1 ? 's' : ''}`}
                                            </span>
                                        </div>
                                        <p className="text-gray-600 text-sm mb-2">{schritt.beschreibung}</p>

                                        {/* Probleme */}
                                        {schritt.probleme.length > 0 && (
                                            <div className="space-y-1">
                                                {schritt.probleme.map((p, i) => (
                                                    <div key={i} className="flex items-start gap-2 text-xs">
                                                        <span className="text-red-500 font-bold mt-0.5">⚠️</span>
                                                        <div>
                                                            <span className="text-red-700 font-medium">{p.text}</span>
                                                            <span className="text-gray-400 mx-1">→</span>
                                                            <span className="text-green-700">{p.loesung}</span>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* BACKEND-WORKFLOW */}
                    <div className="bg-white rounded-xl shadow-lg p-6">
                        <h3 className="text-xl font-bold text-indigo-700 mb-6 flex items-center gap-2">
                            <span className="bg-indigo-100 p-2 rounded-lg">🖥️</span>
                            Dispatcher/Backend-Workflow
                        </h3>

                        <div className="flex flex-wrap gap-3">
                            {backendSchritte.map((schritt, index) => (
                                <React.Fragment key={schritt.id}>
                                    <div className="bg-gray-50 rounded-lg p-4 flex-1 min-w-[180px] border-2 border-gray-200 hover:border-blue-300 transition-colors">
                                        <div className={`w-10 h-10 ${schritt.farbe} rounded-full flex items-center justify-center text-white text-lg mb-2`}>
                                            {schritt.icon}
                                        </div>
                                        <h4 className="font-bold text-sm mb-1">{schritt.titel}</h4>
                                        <p className="text-xs text-gray-600">{schritt.beschreibung}</p>
                                    </div>
                                    {index < backendSchritte.length - 1 && (
                                        <div className="flex items-center text-2xl text-gray-400 self-center">→</div>
                                    )}
                                </React.Fragment>
                            ))}
                        </div>
                    </div>

                    {/* STATUS-FLOW */}
                    <div className="bg-white rounded-xl shadow-lg p-6">
                        <h3 className="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                            <span className="bg-gray-100 p-2 rounded-lg">🔄</span>
                            Status-Flow der Buchung
                        </h3>

                        <div className="flex items-center justify-center gap-2 flex-wrap py-4">
                            {[
                                { status: 'Neu', farbe: 'bg-yellow-400', text: 'text-yellow-900' },
                                { status: 'Angenommen', farbe: 'bg-blue-400', text: 'text-blue-900' },
                                { status: 'Unterwegs', farbe: 'bg-purple-400', text: 'text-purple-900' },
                                { status: 'Abgeschlossen', farbe: 'bg-green-500', text: 'text-green-900' },
                            ].map((s, i, arr) => (
                                <React.Fragment key={s.status}>
                                    <div className={`${s.farbe} ${s.text} px-6 py-3 rounded-xl font-bold text-sm shadow-md`}>
                                        {s.status}
                                    </div>
                                    {i < arr.length - 1 && (
                                        <span className="text-3xl text-gray-400">→</span>
                                    )}
                                </React.Fragment>
                            ))}
                            <div className="ml-8 flex items-center gap-2">
                                <span className="text-red-500 text-2xl">↗</span>
                                <div className="bg-red-400 text-red-900 px-6 py-3 rounded-xl font-bold text-sm shadow-md">
                                    Storniert
                                </div>
                                <span className="text-xs text-gray-500">(jederzeit vor "Unterwegs")</span>
                            </div>
                        </div>
                    </div>

                    {/* MÖGLICHE PROBLEME */}
                    <div className="bg-white rounded-xl shadow-lg p-6">
                        <h3 className="text-xl font-bold text-red-700 mb-4 flex items-center gap-2">
                            <span className="bg-red-100 p-2 rounded-lg">⚠️</span>
                            Mögliche Probleme & Lösungen
                        </h3>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {moeglicheProbleme.map((p, i) => (
                                <div key={i} className={`border-l-4 ${
                                    p.schwere === 'hoch' ? 'border-red-500 bg-red-50' :
                                    p.schwere === 'mittel' ? 'border-yellow-500 bg-yellow-50' :
                                    'border-green-500 bg-green-50'
                                } rounded-r-lg p-4`}>
                                    <div className="flex items-center gap-2 mb-1">
                                        <span className={`text-xs font-bold px-2 py-0.5 rounded ${
                                            p.schwere === 'hoch' ? 'bg-red-200 text-red-800' :
                                            p.schwere === 'mittel' ? 'bg-yellow-200 text-yellow-800' :
                                            'bg-green-200 text-green-800'
                                        }`}>{p.schwere.toUpperCase()}</span>
                                        <span className="text-xs text-gray-500">{p.kategorie}</span>
                                    </div>
                                    <h4 className="font-bold text-sm">{p.problem}</h4>
                                    <p className="text-xs text-gray-700 mt-1">
                                        <span className="font-semibold text-green-700">Lösung:</span> {p.loesung}
                                    </p>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* KLICK-ZUSAMMENFASSUNG */}
                    <div className="bg-gradient-to-r from-blue-600 to-blue-800 rounded-xl shadow-lg p-6 text-white">
                        <h3 className="text-xl font-bold mb-4">Effizienz-Zusammenfassung</h3>
                        <div className="grid grid-cols-3 gap-6 text-center">
                            <div>
                                <div className="text-4xl font-bold">3</div>
                                <div className="text-blue-200 text-sm">Minimum Klicks</div>
                                <div className="text-xs text-blue-300 mt-1">Schnellauswahl → Schnellauswahl → Bestellen</div>
                            </div>
                            <div>
                                <div className="text-4xl font-bold">~30s</div>
                                <div className="text-blue-200 text-sm">Buchungszeit</div>
                                <div className="text-xs text-blue-300 mt-1">Bei bekannten Orten</div>
                            </div>
                            <div>
                                <div className="text-4xl font-bold">5</div>
                                <div className="text-blue-200 text-sm">Status-Stufen</div>
                                <div className="text-xs text-blue-300 mt-1">Neu → Angenommen → Unterwegs → Fertig / Storniert</div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // ============================================
        // TAXI-BUCHUNGS-WORKFLOW - 3-Klick-Bestellung
        // ============================================
        function TaxiBuchungView({ buchungen, setBuchungen, db }) {
            const [schritt, setSchritt] = useState(1); // 1=Von, 2=Nach, 3=Details, 4=Bestätigt
            const [abholung, setAbholung] = useState('');
            const [abholungCustom, setAbholungCustom] = useState('');
            const [ziel, setZiel] = useState('');
            const [zielCustom, setZielCustom] = useState('');
            const [kundenName, setKundenName] = useState('');
            const [kundenTelefon, setKundenTelefon] = useState('');
            const [zeitpunkt, setZeitpunkt] = useState('sofort');
            const [customZeit, setCustomZeit] = useState('');
            const [customDatum, setCustomDatum] = useState(new Date().toISOString().split('T')[0]);
            const [fahrzeugTyp, setFahrzeugTyp] = useState('standard');
            const [bemerkung, setBemerkung] = useState('');
            const [letzteBestellung, setLetzteBestellung] = useState(null);
            const [buchungsListe, setBuchungsListe] = useState([]);
            const [showListe, setShowListe] = useState(false);
            const [personenAnzahl, setPersonenAnzahl] = useState(1);
            const [expandedBuchung, setExpandedBuchung] = useState(null); // Protokoll-Ansicht in Liste
            const [pruefProtokoll, setPruefProtokoll] = useState([]); // Live-Prüfprotokoll
            const [pruefLaeuft, setPruefLaeuft] = useState(false); // Prüfung aktiv?
            const [pruefFehler, setPruefFehler] = useState(false); // Prüfung fehlgeschlagen?

            // Buchungen aus Firebase laden
            useEffect(() => {
                loadBuchungen();
            }, []);

            async function loadBuchungen() {
                try {
                    const snapshot = await db.collection('taxi_buchungen')
                        .orderBy('erstelltAm', 'desc')
                        .limit(50)
                        .get();
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setBuchungsListe(data);
                } catch (e) {
                    console.warn('Taxi-Buchungen laden fehlgeschlagen:', e.message);
                }
            }

            function getAbholText() {
                if (abholung === 'custom') return abholungCustom;
                const ort = BEKANNTE_ORTE.find(o => o.name === abholung);
                return ort ? `${ort.name} (${ort.adresse})` : abholung;
            }

            function getZielText() {
                if (ziel === 'custom') return zielCustom;
                const ort = BEKANNTE_ORTE.find(o => o.name === ziel);
                return ort ? `${ort.name} (${ort.adresse})` : ziel;
            }

            function istNacht() {
                if (zeitpunkt === 'sofort') {
                    const h = new Date().getHours();
                    return h >= 22 || h < 6;
                }
                if (customZeit) {
                    const h = parseInt(customZeit.split(':')[0]);
                    return h >= 22 || h < 6;
                }
                return false;
            }

            function berechnePreis() {
                let preis = TAXI_PREISE.grundpreis;
                // Schätzung: ca. 10km pro Fahrt als Basis
                preis += 10 * TAXI_PREISE.kmPreis;
                if (istNacht()) preis += TAXI_PREISE.nachtzuschlag;
                if (fahrzeugTyp === 'grossraum') preis += TAXI_PREISE.grossraumzuschlag;
                return preis;
            }

            // Prüfschritt zum Protokoll hinzufügen (mit Verzögerung für Live-Effekt)
            function addPruefSchritt(name, status, detail, protokoll) {
                const neuerSchritt = {
                    id: Date.now() + Math.random(),
                    name,
                    status, // 'prueft' | 'ok' | 'warnung' | 'fehler'
                    detail,
                    zeit: new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', second: '2-digit', fractionalSecondDigits: 3 }),
                };
                return [...protokoll, neuerSchritt];
            }

            async function buchungAbschicken() {
                setPruefLaeuft(true);
                setPruefFehler(false);
                setSchritt(4); // Sofort zur Prüf-Ansicht wechseln
                let protokoll = [];
                let hatFehler = false;

                // ========== PRÜFUNG 1: Pflichtfelder ==========
                protokoll = addPruefSchritt('Pflichtfelder prüfen', 'prueft', 'Abholung & Ziel vorhanden?', protokoll);
                setPruefProtokoll([...protokoll]);
                await new Promise(r => setTimeout(r, 400));

                const abholText = getAbholText();
                const zielText = getZielText();

                if (!abholText || abholText.trim().length < 2) {
                    protokoll[protokoll.length - 1].status = 'fehler';
                    protokoll[protokoll.length - 1].detail = 'Abholadresse fehlt oder zu kurz';
                    setPruefProtokoll([...protokoll]);
                    hatFehler = true;
                } else if (!zielText || zielText.trim().length < 2) {
                    protokoll[protokoll.length - 1].status = 'fehler';
                    protokoll[protokoll.length - 1].detail = 'Zieladresse fehlt oder zu kurz';
                    setPruefProtokoll([...protokoll]);
                    hatFehler = true;
                } else {
                    protokoll[protokoll.length - 1].status = 'ok';
                    protokoll[protokoll.length - 1].detail = `Von: "${abholText}" → Nach: "${zielText}"`;
                    setPruefProtokoll([...protokoll]);
                }

                // ========== PRÜFUNG 2: Gleiches Ziel ==========
                await new Promise(r => setTimeout(r, 300));
                protokoll = addPruefSchritt('Identische Adressen prüfen', 'prueft', 'Abholung ≠ Ziel?', protokoll);
                setPruefProtokoll([...protokoll]);
                await new Promise(r => setTimeout(r, 400));

                if (abholText === zielText) {
                    protokoll[protokoll.length - 1].status = 'fehler';
                    protokoll[protokoll.length - 1].detail = 'Abholung und Ziel sind identisch!';
                    setPruefProtokoll([...protokoll]);
                    hatFehler = true;
                } else {
                    protokoll[protokoll.length - 1].status = 'ok';
                    protokoll[protokoll.length - 1].detail = 'Adressen sind unterschiedlich';
                    setPruefProtokoll([...protokoll]);
                }

                // ========== PRÜFUNG 3: Zeitpunkt Validierung ==========
                await new Promise(r => setTimeout(r, 300));
                protokoll = addPruefSchritt('Zeitpunkt validieren', 'prueft', 'Liegt Zeitpunkt in der Zukunft?', protokoll);
                setPruefProtokoll([...protokoll]);
                await new Promise(r => setTimeout(r, 400));

                if (zeitpunkt === 'spaeter') {
                    const gewuenschteZeit = new Date(`${customDatum}T${customZeit || '00:00'}`);
                    const jetzt = new Date();
                    if (gewuenschteZeit < jetzt) {
                        protokoll[protokoll.length - 1].status = 'fehler';
                        protokoll[protokoll.length - 1].detail = `Zeitpunkt ${customDatum} ${customZeit} liegt in der Vergangenheit!`;
                        setPruefProtokoll([...protokoll]);
                        hatFehler = true;
                    } else if (!customZeit) {
                        protokoll[protokoll.length - 1].status = 'warnung';
                        protokoll[protokoll.length - 1].detail = 'Keine Uhrzeit angegeben - wird als 00:00 interpretiert';
                        setPruefProtokoll([...protokoll]);
                    } else {
                        const diffMinuten = Math.round((gewuenschteZeit - jetzt) / 60000);
                        protokoll[protokoll.length - 1].status = 'ok';
                        protokoll[protokoll.length - 1].detail = `Vorbestellung für ${customDatum} ${customZeit} (in ${diffMinuten} Min.)`;
                        setPruefProtokoll([...protokoll]);
                    }
                } else {
                    protokoll[protokoll.length - 1].status = 'ok';
                    protokoll[protokoll.length - 1].detail = 'Sofort-Buchung - keine Zeitprüfung nötig';
                    setPruefProtokoll([...protokoll]);
                }

                // ========== PRÜFUNG 4: Fahrzeugtyp & Personen ==========
                await new Promise(r => setTimeout(r, 300));
                protokoll = addPruefSchritt('Fahrzeugtyp prüfen', 'prueft', 'Passt Personenanzahl zum Fahrzeug?', protokoll);
                setPruefProtokoll([...protokoll]);
                await new Promise(r => setTimeout(r, 400));

                if (fahrzeugTyp === 'standard' && personenAnzahl > 4) {
                    protokoll[protokoll.length - 1].status = 'warnung';
                    protokoll[protokoll.length - 1].detail = `${personenAnzahl} Personen passen nicht in Standard-Taxi (max. 4) - automatisch auf Großraum geändert`;
                    setPruefProtokoll([...protokoll]);
                    // Auto-Korrektur
                    setFahrzeugTyp('grossraum');
                } else {
                    protokoll[protokoll.length - 1].status = 'ok';
                    protokoll[protokoll.length - 1].detail = `${fahrzeugTyp === 'grossraum' ? 'Großraum' : 'Standard'}-Taxi für ${personenAnzahl} Person(en)`;
                    setPruefProtokoll([...protokoll]);
                }

                // ========== PRÜFUNG 5: Duplikat-Check ==========
                await new Promise(r => setTimeout(r, 300));
                protokoll = addPruefSchritt('Duplikat-Erkennung', 'prueft', 'Gibt es eine ähnliche Buchung in den letzten 30 Minuten?', protokoll);
                setPruefProtokoll([...protokoll]);
                await new Promise(r => setTimeout(r, 500));

                const vor30Min = new Date(Date.now() - 30 * 60 * 1000).toISOString();
                const duplikat = buchungsListe.find(b =>
                    b.abholung === abholText &&
                    b.ziel === zielText &&
                    b.erstelltAm > vor30Min &&
                    b.status !== 'storniert'
                );

                if (duplikat) {
                    protokoll[protokoll.length - 1].status = 'warnung';
                    protokoll[protokoll.length - 1].detail = `Mögliches Duplikat gefunden! Gleiche Route wurde um ${new Date(duplikat.erstelltAm).toLocaleTimeString('de-DE')} gebucht (${duplikat.kundenName})`;
                    setPruefProtokoll([...protokoll]);
                } else {
                    protokoll[protokoll.length - 1].status = 'ok';
                    protokoll[protokoll.length - 1].detail = 'Keine Duplikate in den letzten 30 Minuten';
                    setPruefProtokoll([...protokoll]);
                }

                // ========== PRÜFUNG 6: Nachtfahrt-Check ==========
                await new Promise(r => setTimeout(r, 300));
                protokoll = addPruefSchritt('Nachtfahrt-Zuschlag', 'prueft', 'Fällt die Fahrt in den Nachtzeitraum (22-06 Uhr)?', protokoll);
                setPruefProtokoll([...protokoll]);
                await new Promise(r => setTimeout(r, 400));

                if (istNacht()) {
                    protokoll[protokoll.length - 1].status = 'warnung';
                    protokoll[protokoll.length - 1].detail = `Nachtfahrt erkannt - Zuschlag von ${TAXI_PREISE.nachtzuschlag.toFixed(2)} € wird berechnet`;
                    setPruefProtokoll([...protokoll]);
                } else {
                    protokoll[protokoll.length - 1].status = 'ok';
                    protokoll[protokoll.length - 1].detail = 'Tagfahrt - kein Nachtzuschlag';
                    setPruefProtokoll([...protokoll]);
                }

                // ========== PRÜFUNG 7: Preisberechnung ==========
                await new Promise(r => setTimeout(r, 300));
                protokoll = addPruefSchritt('Preisberechnung', 'prueft', 'Geschätzten Fahrpreis berechnen...', protokoll);
                setPruefProtokoll([...protokoll]);
                await new Promise(r => setTimeout(r, 400));

                const preis = berechnePreis();
                const preisDetails = [];
                preisDetails.push(`Grundpreis: ${TAXI_PREISE.grundpreis.toFixed(2)} €`);
                preisDetails.push(`Strecke (ca. 10km): ${(10 * TAXI_PREISE.kmPreis).toFixed(2)} €`);
                if (istNacht()) preisDetails.push(`Nachtzuschlag: ${TAXI_PREISE.nachtzuschlag.toFixed(2)} €`);
                if (fahrzeugTyp === 'grossraum') preisDetails.push(`Großraumzuschlag: ${TAXI_PREISE.grossraumzuschlag.toFixed(2)} €`);
                protokoll[protokoll.length - 1].status = 'ok';
                protokoll[protokoll.length - 1].detail = `Geschätzter Preis: ${preis.toFixed(2)} € (${preisDetails.join(' + ')})`;
                setPruefProtokoll([...protokoll]);

                // ========== PRÜFUNG 8: Telefonnummer-Format ==========
                await new Promise(r => setTimeout(r, 300));
                protokoll = addPruefSchritt('Kontaktdaten prüfen', 'prueft', 'Telefonnummer-Format valide?', protokoll);
                setPruefProtokoll([...protokoll]);
                await new Promise(r => setTimeout(r, 400));

                if (kundenTelefon && kundenTelefon.length > 0) {
                    const telefonBereinigt = kundenTelefon.replace(/[\s\-\(\)\/]/g, '');
                    if (telefonBereinigt.length < 6) {
                        protokoll[protokoll.length - 1].status = 'warnung';
                        protokoll[protokoll.length - 1].detail = `Telefonnummer "${kundenTelefon}" scheint zu kurz - Rückruf evtl. nicht möglich`;
                        setPruefProtokoll([...protokoll]);
                    } else if (!/^[\+0-9]/.test(telefonBereinigt)) {
                        protokoll[protokoll.length - 1].status = 'warnung';
                        protokoll[protokoll.length - 1].detail = `Telefonnummer "${kundenTelefon}" hat ungewöhnliches Format`;
                        setPruefProtokoll([...protokoll]);
                    } else {
                        protokoll[protokoll.length - 1].status = 'ok';
                        protokoll[protokoll.length - 1].detail = `Telefon: ${kundenTelefon} - Format OK`;
                        setPruefProtokoll([...protokoll]);
                    }
                } else {
                    protokoll[protokoll.length - 1].status = 'warnung';
                    protokoll[protokoll.length - 1].detail = 'Keine Telefonnummer angegeben - kein Rückruf bei Problemen möglich';
                    setPruefProtokoll([...protokoll]);
                }

                // ========== ABBRUCH BEI FEHLER ==========
                if (hatFehler) {
                    await new Promise(r => setTimeout(r, 500));
                    protokoll = addPruefSchritt('ABGEBROCHEN', 'fehler', 'Buchung wurde NICHT erstellt - bitte Fehler oben korrigieren', protokoll);
                    setPruefProtokoll([...protokoll]);
                    setPruefLaeuft(false);
                    setPruefFehler(true);
                    return;
                }

                // ========== PRÜFUNG 9: Firebase-Verbindung ==========
                await new Promise(r => setTimeout(r, 300));
                protokoll = addPruefSchritt('Firebase-Verbindung', 'prueft', 'Verbindung zur Datenbank testen...', protokoll);
                setPruefProtokoll([...protokoll]);

                const buchung = {
                    abholung: abholText,
                    ziel: zielText,
                    kundenName: kundenName || 'Gast',
                    kundenTelefon: kundenTelefon || '-',
                    zeitpunkt: zeitpunkt === 'sofort' ? 'Sofort' : `${customDatum} ${customZeit}`,
                    fahrzeugTyp: personenAnzahl > 4 ? 'grossraum' : fahrzeugTyp,
                    personenAnzahl,
                    bemerkung,
                    status: 'neu',
                    geschaetzterPreis: preis.toFixed(2),
                    erstelltAm: new Date().toISOString(),
                    pruefProtokoll: protokoll.map(p => ({ name: p.name, status: p.status, detail: p.detail, zeit: p.zeit })),
                };

                try {
                    const docRef = await db.collection('taxi_buchungen').add(buchung);
                    buchung.id = docRef.id;

                    protokoll[protokoll.length - 1].status = 'ok';
                    protokoll[protokoll.length - 1].detail = `Erfolgreich gespeichert (ID: ${docRef.id.substring(0, 8)}...)`;
                    setPruefProtokoll([...protokoll]);

                    // ========== PRÜFUNG 10: Bestätigung ==========
                    await new Promise(r => setTimeout(r, 400));
                    const fehlerCount = protokoll.filter(p => p.status === 'fehler').length;
                    const warnungCount = protokoll.filter(p => p.status === 'warnung').length;
                    const okCount = protokoll.filter(p => p.status === 'ok').length;

                    protokoll = addPruefSchritt(
                        'BUCHUNG ERFOLGREICH',
                        'ok',
                        `Alle Prüfungen abgeschlossen: ${okCount} bestanden, ${warnungCount} Warnung(en), ${fehlerCount} Fehler`,
                        protokoll
                    );
                    setPruefProtokoll([...protokoll]);

                    setLetzteBestellung(buchung);
                    await loadBuchungen();
                } catch (e) {
                    protokoll[protokoll.length - 1].status = 'fehler';
                    protokoll[protokoll.length - 1].detail = `Firebase-Fehler: ${e.message}`;
                    setPruefProtokoll([...protokoll]);

                    protokoll = addPruefSchritt('BUCHUNG FEHLGESCHLAGEN', 'fehler', 'Daten konnten nicht gespeichert werden - bitte erneut versuchen', protokoll);
                    setPruefProtokoll([...protokoll]);
                    setPruefFehler(true);
                }

                setPruefLaeuft(false);
            }

            function neueBuchung() {
                setSchritt(1);
                setAbholung('');
                setAbholungCustom('');
                setZiel('');
                setZielCustom('');
                setKundenName('');
                setKundenTelefon('');
                setZeitpunkt('sofort');
                setCustomZeit('');
                setCustomDatum(new Date().toISOString().split('T')[0]);
                setFahrzeugTyp('standard');
                setBemerkung('');
                setPersonenAnzahl(1);
                setLetzteBestellung(null);
                setPruefProtokoll([]);
                setPruefLaeuft(false);
                setPruefFehler(false);
            }

            async function updateBuchungStatus(id, neuerStatus) {
                try {
                    await db.collection('taxi_buchungen').doc(id).update({ status: neuerStatus });
                    await loadBuchungen();
                } catch (e) {
                    console.error('Status-Update fehlgeschlagen:', e);
                }
            }

            // Schnellauswahl-Grid für Orte
            function OrtAuswahl({ value, setValue, customValue, setCustomValue, label }) {
                return (
                    <div>
                        <h3 className="text-xl font-bold text-gray-800 mb-4">{label}</h3>

                        {/* Schnellauswahl-Buttons */}
                        <div className="grid grid-cols-2 md:grid-cols-3 gap-3 mb-4">
                            {BEKANNTE_ORTE.map(ort => (
                                <button
                                    key={ort.name}
                                    onClick={() => { setValue(ort.name); setCustomValue(''); }}
                                    className={`p-4 rounded-lg border-2 text-left transition-all hover:shadow-md ${
                                        value === ort.name
                                            ? 'border-blue-500 bg-blue-50 shadow-md'
                                            : 'border-gray-200 hover:border-blue-300'
                                    }`}
                                >
                                    <span className="text-2xl">{ort.icon}</span>
                                    <div className="font-semibold text-sm mt-1">{ort.name}</div>
                                    <div className="text-xs text-gray-500 truncate">{ort.adresse}</div>
                                </button>
                            ))}
                        </div>

                        {/* Custom-Eingabe */}
                        <div className="mt-4">
                            <div className="relative">
                                <input
                                    type="text"
                                    placeholder="Oder andere Adresse eingeben..."
                                    value={value === 'custom' ? customValue : ''}
                                    onChange={(e) => {
                                        setValue('custom');
                                        setCustomValue(e.target.value);
                                    }}
                                    onFocus={() => { if (value !== 'custom') { setValue('custom'); } }}
                                    className="w-full p-4 text-lg border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
                                />
                                <span className="absolute right-4 top-4 text-2xl">📍</span>
                            </div>
                        </div>
                    </div>
                );
            }

            // Status-Badge
            function StatusBadge({ status }) {
                const farben = {
                    'neu': 'bg-yellow-100 text-yellow-800',
                    'angenommen': 'bg-blue-100 text-blue-800',
                    'unterwegs': 'bg-purple-100 text-purple-800',
                    'abgeschlossen': 'bg-green-100 text-green-800',
                    'storniert': 'bg-red-100 text-red-800',
                };
                return (
                    <span className={`px-2 py-1 rounded-full text-xs font-semibold ${farben[status] || 'bg-gray-100'}`}>
                        {status.charAt(0).toUpperCase() + status.slice(1)}
                    </span>
                );
            }

            return (
                <div className="space-y-6">
                    {/* Header mit Toggle */}
                    <div className="flex justify-between items-center">
                        <h2 className="text-3xl font-bold text-gray-800">Taxi-Buchung</h2>
                        <div className="flex gap-3">
                            <button
                                onClick={() => setShowListe(false)}
                                className={`px-4 py-2 rounded-lg font-medium ${!showListe ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-700'}`}
                            >
                                + Neue Buchung
                            </button>
                            <button
                                onClick={() => setShowListe(true)}
                                className={`px-4 py-2 rounded-lg font-medium ${showListe ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-700'}`}
                            >
                                Buchungen ({buchungsListe.length})
                            </button>
                        </div>
                    </div>

                    {showListe ? (
                        /* BUCHUNGSLISTE */
                        <div className="bg-white rounded-xl shadow-lg overflow-hidden">
                            <table className="w-full">
                                <thead className="bg-gray-50">
                                    <tr>
                                        <th className="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Zeit</th>
                                        <th className="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Kunde</th>
                                        <th className="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Von</th>
                                        <th className="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Nach</th>
                                        <th className="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Status</th>
                                        <th className="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Aktionen</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-gray-200">
                                    {buchungsListe.map(b => (
                                        <tr key={b.id} className="hover:bg-gray-50">
                                            <td className="px-4 py-3 text-sm">
                                                <div className="font-medium">{b.zeitpunkt}</div>
                                                <div className="text-xs text-gray-500">{new Date(b.erstelltAm).toLocaleString('de-DE')}</div>
                                            </td>
                                            <td className="px-4 py-3 text-sm">
                                                <div className="font-medium">{b.kundenName}</div>
                                                <div className="text-xs text-gray-500">{b.kundenTelefon}</div>
                                            </td>
                                            <td className="px-4 py-3 text-sm truncate max-w-xs">{b.abholung}</td>
                                            <td className="px-4 py-3 text-sm truncate max-w-xs">{b.ziel}</td>
                                            <td className="px-4 py-3"><StatusBadge status={b.status} /></td>
                                            <td className="px-4 py-3">
                                                <div className="flex gap-1">
                                                    {b.status === 'neu' && (
                                                        <button onClick={() => updateBuchungStatus(b.id, 'angenommen')}
                                                            className="px-2 py-1 bg-blue-500 text-white text-xs rounded hover:bg-blue-600">
                                                            Annehmen
                                                        </button>
                                                    )}
                                                    {b.status === 'angenommen' && (
                                                        <button onClick={() => updateBuchungStatus(b.id, 'unterwegs')}
                                                            className="px-2 py-1 bg-purple-500 text-white text-xs rounded hover:bg-purple-600">
                                                            Unterwegs
                                                        </button>
                                                    )}
                                                    {b.status === 'unterwegs' && (
                                                        <button onClick={() => updateBuchungStatus(b.id, 'abgeschlossen')}
                                                            className="px-2 py-1 bg-green-500 text-white text-xs rounded hover:bg-green-600">
                                                            Erledigt
                                                        </button>
                                                    )}
                                                    {(b.status === 'neu' || b.status === 'angenommen') && (
                                                        <button onClick={() => updateBuchungStatus(b.id, 'storniert')}
                                                            className="px-2 py-1 bg-red-100 text-red-700 text-xs rounded hover:bg-red-200">
                                                            Storno
                                                        </button>
                                                    )}
                                                    {b.pruefProtokoll && (
                                                        <button onClick={() => setExpandedBuchung(expandedBuchung === b.id ? null : b.id)}
                                                            className={`px-2 py-1 text-xs rounded ${expandedBuchung === b.id ? 'bg-gray-800 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}`}>
                                                            {expandedBuchung === b.id ? 'Protokoll ▲' : 'Protokoll ▼'}
                                                        </button>
                                                    )}
                                                </div>
                                            </td>
                                        </tr>
                                        {/* Expandiertes Prüfprotokoll */}
                                        {expandedBuchung === b.id && b.pruefProtokoll && (
                                            <tr>
                                                <td colSpan="6" className="px-4 py-3 bg-gray-50">
                                                    <div className="text-xs font-bold text-gray-700 mb-2">Prüfprotokoll der Bestellung:</div>
                                                    <div className="space-y-1">
                                                        {b.pruefProtokoll.map((p, pi) => (
                                                            <div key={pi} className={`flex items-center gap-2 text-xs px-2 py-1 rounded ${
                                                                p.status === 'ok' ? 'bg-green-50 text-green-700' :
                                                                p.status === 'warnung' ? 'bg-yellow-50 text-yellow-700' :
                                                                p.status === 'fehler' ? 'bg-red-50 text-red-700' :
                                                                'bg-blue-50 text-blue-700'
                                                            }`}>
                                                                <span>
                                                                    {p.status === 'ok' && '✅'}
                                                                    {p.status === 'warnung' && '⚠️'}
                                                                    {p.status === 'fehler' && '❌'}
                                                                    {p.status === 'prueft' && '🔄'}
                                                                </span>
                                                                <span className="font-semibold">{p.name}</span>
                                                                <span className="text-gray-400">|</span>
                                                                <span>{p.detail}</span>
                                                                <span className="ml-auto text-gray-400">{p.zeit}</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </td>
                                            </tr>
                                        )}
                                    ))}
                                    {buchungsListe.length === 0 && (
                                        <tr>
                                            <td colSpan="6" className="px-4 py-8 text-center text-gray-500">
                                                Noch keine Buchungen vorhanden
                                            </td>
                                        </tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    ) : (
                        /* BUCHUNGS-WIZARD */
                        <div>
                            {/* Fortschrittsanzeige */}
                            <div className="bg-white rounded-xl shadow-lg p-6 mb-6">
                                <div className="flex items-center justify-between mb-2">
                                    {[
                                        { nr: 1, label: 'Abholung' },
                                        { nr: 2, label: 'Ziel' },
                                        { nr: 3, label: 'Details' },
                                        { nr: 4, label: 'Fertig' },
                                    ].map((s, i) => (
                                        <React.Fragment key={s.nr}>
                                            <div className="flex flex-col items-center">
                                                <div className={`w-10 h-10 rounded-full flex items-center justify-center font-bold text-lg ${
                                                    schritt >= s.nr
                                                        ? 'bg-blue-600 text-white'
                                                        : 'bg-gray-200 text-gray-500'
                                                }`}>
                                                    {schritt > s.nr ? '✓' : s.nr}
                                                </div>
                                                <span className="text-xs mt-1 text-gray-600">{s.label}</span>
                                            </div>
                                            {i < 3 && (
                                                <div className={`flex-1 h-1 mx-2 rounded ${
                                                    schritt > s.nr ? 'bg-blue-600' : 'bg-gray-200'
                                                }`}></div>
                                            )}
                                        </React.Fragment>
                                    ))}
                                </div>
                            </div>

                            {/* SCHRITT 1: Abholung */}
                            {schritt === 1 && (
                                <div className="bg-white rounded-xl shadow-lg p-6">
                                    <OrtAuswahl
                                        value={abholung}
                                        setValue={setAbholung}
                                        customValue={abholungCustom}
                                        setCustomValue={setAbholungCustom}
                                        label="Wo sollen wir Sie abholen?"
                                    />
                                    <div className="mt-6 flex justify-end">
                                        <button
                                            onClick={() => setSchritt(2)}
                                            disabled={!abholung || (abholung === 'custom' && !abholungCustom)}
                                            className={`px-8 py-3 rounded-lg text-lg font-semibold transition-all ${
                                                abholung && (abholung !== 'custom' || abholungCustom)
                                                    ? 'bg-blue-600 text-white hover:bg-blue-700 shadow-lg'
                                                    : 'bg-gray-300 text-gray-500 cursor-not-allowed'
                                            }`}
                                        >
                                            Weiter →
                                        </button>
                                    </div>
                                </div>
                            )}

                            {/* SCHRITT 2: Ziel */}
                            {schritt === 2 && (
                                <div className="bg-white rounded-xl shadow-lg p-6">
                                    <OrtAuswahl
                                        value={ziel}
                                        setValue={setZiel}
                                        customValue={zielCustom}
                                        setCustomValue={setZielCustom}
                                        label="Wohin möchten Sie fahren?"
                                    />
                                    <div className="mt-6 flex justify-between">
                                        <button
                                            onClick={() => setSchritt(1)}
                                            className="px-6 py-3 rounded-lg text-gray-600 hover:bg-gray-100"
                                        >
                                            ← Zurück
                                        </button>
                                        <button
                                            onClick={() => setSchritt(3)}
                                            disabled={!ziel || (ziel === 'custom' && !zielCustom)}
                                            className={`px-8 py-3 rounded-lg text-lg font-semibold transition-all ${
                                                ziel && (ziel !== 'custom' || zielCustom)
                                                    ? 'bg-blue-600 text-white hover:bg-blue-700 shadow-lg'
                                                    : 'bg-gray-300 text-gray-500 cursor-not-allowed'
                                            }`}
                                        >
                                            Weiter →
                                        </button>
                                    </div>
                                </div>
                            )}

                            {/* SCHRITT 3: Details & Bestätigung */}
                            {schritt === 3 && (
                                <div className="bg-white rounded-xl shadow-lg p-6">
                                    <h3 className="text-xl font-bold text-gray-800 mb-4">Fahrt-Details</h3>

                                    {/* Zusammenfassung Route */}
                                    <div className="bg-blue-50 rounded-lg p-4 mb-6">
                                        <div className="flex items-center gap-3">
                                            <div className="text-center">
                                                <div className="w-4 h-4 bg-green-500 rounded-full mx-auto"></div>
                                                <div className="w-0.5 h-8 bg-gray-300 mx-auto"></div>
                                                <div className="w-4 h-4 bg-red-500 rounded-full mx-auto"></div>
                                            </div>
                                            <div className="flex-1">
                                                <div className="font-semibold text-green-700 mb-3">{getAbholText()}</div>
                                                <div className="font-semibold text-red-700">{getZielText()}</div>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                                        {/* Kundenname */}
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Name (optional)</label>
                                            <input
                                                type="text"
                                                value={kundenName}
                                                onChange={(e) => setKundenName(e.target.value)}
                                                placeholder="Ihr Name"
                                                className="w-full p-3 border rounded-lg"
                                            />
                                        </div>

                                        {/* Telefon */}
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Telefon (optional)</label>
                                            <input
                                                type="tel"
                                                value={kundenTelefon}
                                                onChange={(e) => setKundenTelefon(e.target.value)}
                                                placeholder="Rückrufnummer"
                                                className="w-full p-3 border rounded-lg"
                                            />
                                        </div>

                                        {/* Zeitpunkt */}
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Wann?</label>
                                            <div className="flex gap-2">
                                                <button
                                                    onClick={() => setZeitpunkt('sofort')}
                                                    className={`flex-1 py-3 rounded-lg font-semibold transition-all ${
                                                        zeitpunkt === 'sofort'
                                                            ? 'bg-green-600 text-white'
                                                            : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                                                    }`}
                                                >
                                                    Sofort
                                                </button>
                                                <button
                                                    onClick={() => setZeitpunkt('spaeter')}
                                                    className={`flex-1 py-3 rounded-lg font-semibold transition-all ${
                                                        zeitpunkt === 'spaeter'
                                                            ? 'bg-blue-600 text-white'
                                                            : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                                                    }`}
                                                >
                                                    Vorbestellen
                                                </button>
                                            </div>
                                            {zeitpunkt === 'spaeter' && (
                                                <div className="flex gap-2 mt-2">
                                                    <input
                                                        type="date"
                                                        value={customDatum}
                                                        onChange={(e) => setCustomDatum(e.target.value)}
                                                        className="flex-1 p-2 border rounded-lg"
                                                    />
                                                    <input
                                                        type="time"
                                                        value={customZeit}
                                                        onChange={(e) => setCustomZeit(e.target.value)}
                                                        className="flex-1 p-2 border rounded-lg"
                                                    />
                                                </div>
                                            )}
                                        </div>

                                        {/* Fahrzeugtyp */}
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Fahrzeug</label>
                                            <div className="flex gap-2">
                                                <button
                                                    onClick={() => setFahrzeugTyp('standard')}
                                                    className={`flex-1 py-3 rounded-lg text-center transition-all ${
                                                        fahrzeugTyp === 'standard'
                                                            ? 'bg-blue-600 text-white'
                                                            : 'bg-gray-100 hover:bg-gray-200'
                                                    }`}
                                                >
                                                    <div className="text-2xl">🚗</div>
                                                    <div className="text-xs font-medium">Standard</div>
                                                    <div className="text-xs">1-4 Pers.</div>
                                                </button>
                                                <button
                                                    onClick={() => setFahrzeugTyp('grossraum')}
                                                    className={`flex-1 py-3 rounded-lg text-center transition-all ${
                                                        fahrzeugTyp === 'grossraum'
                                                            ? 'bg-blue-600 text-white'
                                                            : 'bg-gray-100 hover:bg-gray-200'
                                                    }`}
                                                >
                                                    <div className="text-2xl">🚐</div>
                                                    <div className="text-xs font-medium">Großraum</div>
                                                    <div className="text-xs">5-8 Pers.</div>
                                                </button>
                                            </div>
                                        </div>

                                        {/* Personenanzahl */}
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Personen</label>
                                            <div className="flex items-center gap-3">
                                                <button
                                                    onClick={() => setPersonenAnzahl(Math.max(1, personenAnzahl - 1))}
                                                    className="w-10 h-10 rounded-full bg-gray-200 text-xl font-bold hover:bg-gray-300"
                                                >-</button>
                                                <span className="text-2xl font-bold w-8 text-center">{personenAnzahl}</span>
                                                <button
                                                    onClick={() => setPersonenAnzahl(Math.min(8, personenAnzahl + 1))}
                                                    className="w-10 h-10 rounded-full bg-gray-200 text-xl font-bold hover:bg-gray-300"
                                                >+</button>
                                            </div>
                                        </div>

                                        {/* Bemerkung */}
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Bemerkung (optional)</label>
                                            <input
                                                type="text"
                                                value={bemerkung}
                                                onChange={(e) => setBemerkung(e.target.value)}
                                                placeholder="z.B. Kindersitz, Gepäck..."
                                                className="w-full p-3 border rounded-lg"
                                            />
                                        </div>
                                    </div>

                                    {/* Preisschätzung */}
                                    <div className="bg-yellow-50 border border-yellow-200 rounded-lg p-4 mb-6">
                                        <div className="flex justify-between items-center">
                                            <span className="text-gray-700">Geschätzter Preis:</span>
                                            <span className="text-2xl font-bold text-gray-800">ca. {berechnePreis().toFixed(2)} €</span>
                                        </div>
                                        <p className="text-xs text-gray-500 mt-1">
                                            Grundpreis {TAXI_PREISE.grundpreis.toFixed(2)} € + {TAXI_PREISE.kmPreis.toFixed(2)} €/km
                                            {istNacht() && ` + ${TAXI_PREISE.nachtzuschlag.toFixed(2)} € Nachtzuschlag`}
                                            {fahrzeugTyp === 'grossraum' && ` + ${TAXI_PREISE.grossraumzuschlag.toFixed(2)} € Großraumzuschlag`}
                                        </p>
                                    </div>

                                    {/* Buttons */}
                                    <div className="flex justify-between">
                                        <button
                                            onClick={() => setSchritt(2)}
                                            className="px-6 py-3 rounded-lg text-gray-600 hover:bg-gray-100"
                                        >
                                            ← Zurück
                                        </button>
                                        <button
                                            onClick={buchungAbschicken}
                                            className="px-10 py-4 rounded-lg text-xl font-bold bg-green-600 text-white hover:bg-green-700 shadow-lg transition-all hover:scale-105"
                                        >
                                            Taxi bestellen!
                                        </button>
                                    </div>
                                </div>
                            )}

                            {/* SCHRITT 4: LIVE-PRÜFPROTOKOLL + Bestätigung */}
                            {schritt === 4 && (
                                <div className="bg-white rounded-xl shadow-lg p-6">
                                    <h3 className="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                                        {pruefLaeuft && <span className="animate-spin text-blue-600">⚙️</span>}
                                        {!pruefLaeuft && !pruefFehler && pruefProtokoll.length > 0 && <span>✅</span>}
                                        {pruefFehler && <span>❌</span>}
                                        Bestellungs-Prüfprotokoll
                                        {pruefLaeuft && <span className="text-sm font-normal text-blue-600 ml-2">Prüfung läuft...</span>}
                                    </h3>

                                    {/* Live-Protokoll-Liste */}
                                    <div className="space-y-2 mb-6">
                                        {pruefProtokoll.map((p, i) => (
                                            <div
                                                key={p.id}
                                                className={`flex items-start gap-3 p-3 rounded-lg border-l-4 transition-all ${
                                                    p.status === 'ok' ? 'bg-green-50 border-green-500' :
                                                    p.status === 'warnung' ? 'bg-yellow-50 border-yellow-500' :
                                                    p.status === 'fehler' ? 'bg-red-50 border-red-500' :
                                                    'bg-blue-50 border-blue-500'
                                                }`}
                                            >
                                                {/* Status-Icon */}
                                                <div className="text-xl flex-shrink-0 mt-0.5">
                                                    {p.status === 'ok' && '✅'}
                                                    {p.status === 'warnung' && '⚠️'}
                                                    {p.status === 'fehler' && '❌'}
                                                    {p.status === 'prueft' && <span className="animate-spin inline-block">🔄</span>}
                                                </div>

                                                {/* Inhalt */}
                                                <div className="flex-1 min-w-0">
                                                    <div className="flex items-center gap-2">
                                                        <span className="font-semibold text-sm">{p.name}</span>
                                                        <span className="text-xs text-gray-400">{p.zeit}</span>
                                                    </div>
                                                    <p className={`text-sm mt-0.5 ${
                                                        p.status === 'ok' ? 'text-green-700' :
                                                        p.status === 'warnung' ? 'text-yellow-700' :
                                                        p.status === 'fehler' ? 'text-red-700' :
                                                        'text-blue-700'
                                                    }`}>
                                                        {p.detail}
                                                    </p>
                                                </div>

                                                {/* Nummer */}
                                                <div className="text-xs text-gray-400 font-mono flex-shrink-0">
                                                    #{i + 1}
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    {/* Zusammenfassung wenn fertig */}
                                    {!pruefLaeuft && pruefProtokoll.length > 0 && (
                                        <div className={`rounded-lg p-4 mb-6 ${pruefFehler ? 'bg-red-100 border border-red-300' : 'bg-green-100 border border-green-300'}`}>
                                            <div className="flex items-center gap-4 justify-center text-sm font-semibold">
                                                <span className="flex items-center gap-1">
                                                    ✅ {pruefProtokoll.filter(p => p.status === 'ok').length} OK
                                                </span>
                                                <span className="flex items-center gap-1">
                                                    ⚠️ {pruefProtokoll.filter(p => p.status === 'warnung').length} Warnungen
                                                </span>
                                                <span className="flex items-center gap-1">
                                                    ❌ {pruefProtokoll.filter(p => p.status === 'fehler').length} Fehler
                                                </span>
                                            </div>
                                        </div>
                                    )}

                                    {/* Buchungsdetails wenn erfolgreich */}
                                    {!pruefLaeuft && !pruefFehler && letzteBestellung && (
                                        <div className="bg-gray-50 rounded-lg p-6 max-w-lg mx-auto mb-6">
                                            <h4 className="font-bold text-center text-green-700 text-lg mb-3">Buchung erfolgreich erstellt</h4>
                                            <div className="space-y-2 text-sm">
                                                <div className="flex justify-between">
                                                    <span className="text-gray-500">Buchungs-ID:</span>
                                                    <span className="font-mono text-xs">{letzteBestellung.id}</span>
                                                </div>
                                                <div className="flex justify-between">
                                                    <span className="text-gray-500">Abholung:</span>
                                                    <span className="font-medium">{letzteBestellung.abholung}</span>
                                                </div>
                                                <div className="flex justify-between">
                                                    <span className="text-gray-500">Ziel:</span>
                                                    <span className="font-medium">{letzteBestellung.ziel}</span>
                                                </div>
                                                <div className="flex justify-between">
                                                    <span className="text-gray-500">Wann:</span>
                                                    <span className="font-medium">{letzteBestellung.zeitpunkt}</span>
                                                </div>
                                                <div className="flex justify-between">
                                                    <span className="text-gray-500">Fahrzeug:</span>
                                                    <span className="font-medium">{letzteBestellung.fahrzeugTyp === 'grossraum' ? 'Großraum' : 'Standard'}</span>
                                                </div>
                                                <hr className="my-2" />
                                                <div className="flex justify-between text-lg font-bold">
                                                    <span>Preis ca.:</span>
                                                    <span>{letzteBestellung.geschaetzterPreis} €</span>
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    {/* Buttons */}
                                    {!pruefLaeuft && (
                                        <div className="flex gap-4 justify-center">
                                            {pruefFehler && (
                                                <button
                                                    onClick={() => { setSchritt(3); setPruefProtokoll([]); setPruefFehler(false); }}
                                                    className="px-8 py-3 bg-orange-600 text-white rounded-lg font-semibold hover:bg-orange-700"
                                                >
                                                    ← Zurück & korrigieren
                                                </button>
                                            )}
                                            <button
                                                onClick={neueBuchung}
                                                className="px-8 py-3 bg-blue-600 text-white rounded-lg font-semibold hover:bg-blue-700"
                                            >
                                                Neue Buchung
                                            </button>
                                            <button
                                                onClick={() => setShowListe(true)}
                                                className="px-8 py-3 bg-gray-200 text-gray-700 rounded-lg font-semibold hover:bg-gray-300"
                                            >
                                                Alle Buchungen
                                            </button>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        function AuswertungenView({ dokumente }) {
            const [zeitraum, setZeitraum] = useState('monat');
            
            const jetzt = new Date();
            let startDatum, endDatum;
            
            if (zeitraum === 'monat') {
                startDatum = new Date(jetzt.getFullYear(), jetzt.getMonth(), 1);
                endDatum = new Date(jetzt.getFullYear(), jetzt.getMonth() + 1, 0);
            } else if (zeitraum === 'quartal') {
                const quartal = Math.floor(jetzt.getMonth() / 3);
                startDatum = new Date(jetzt.getFullYear(), quartal * 3, 1);
                endDatum = new Date(jetzt.getFullYear(), (quartal + 1) * 3, 0);
            } else {
                startDatum = new Date(jetzt.getFullYear(), 0, 1);
                endDatum = new Date(jetzt.getFullYear(), 11, 31);
            }

            const zeitraumDokumente = dokumente.filter(d => {
                const datum = new Date(d.datum);
                return datum >= startDatum && datum <= endDatum;
            });

            const einnahmen = zeitraumDokumente
                .filter(d => d.typ === 'ausgangsrechnung')
                .reduce((sum, d) => sum + parseFloat(d.betrag || 0), 0);

            const ausgaben = zeitraumDokumente
                .filter(d => d.typ !== 'ausgangsrechnung')
                .reduce((sum, d) => sum + parseFloat(d.betrag || 0), 0);

            function exportCSV() {
                const headers = ['Datum', 'Absender', 'Beschreibung', 'Betrag', 'Kategorie', 'Status', 'Rechnungsnummer'];
                const rows = zeitraumDokumente.map(d => [
                    d.datum,
                    d.absender,
                    d.beschreibung,
                    d.betrag,
                    d.kategorie,
                    d.status,
                    d.rechnungsnummer || ''
                ]);
                
                const csvContent = [headers, ...rows].map(row => row.join(';')).join('\n');
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `export_${zeitraum}_${new Date().toISOString().split('T')[0]}.csv`;
                link.click();
            }

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center">
                        <h2 className="text-3xl font-bold text-gray-800">Auswertungen & Export</h2>
                        
                        <div className="flex gap-4">
                            <select value={zeitraum} onChange={(e) => setZeitraum(e.target.value)} className="px-4 py-2 border rounded">
                                <option value="monat">Aktueller Monat</option>
                                <option value="quartal">Aktuelles Quartal</option>
                                <option value="jahr">Aktuelles Jahr</option>
                            </select>
                            
                            <button
                                onClick={exportCSV}
                                className="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700"
                            >
                                📥 CSV Export ({zeitraumDokumente.length} Dok.)
                            </button>
                        </div>
                    </div>

                    <div className="grid grid-cols-3 gap-6">
                        <div className="bg-white rounded-lg shadow-md p-6">
                            <h3 className="text-lg font-semibold text-gray-700 mb-2">💰 Einnahmen</h3>
                            <p className="text-3xl font-bold text-green-600">{einnahmen.toFixed(2)} €</p>
                        </div>
                        <div className="bg-white rounded-lg shadow-md p-6">
                            <h3 className="text-lg font-semibold text-gray-700 mb-2">💸 Ausgaben</h3>
                            <p className="text-3xl font-bold text-red-600">{ausgaben.toFixed(2)} €</p>
                        </div>
                        <div className="bg-white rounded-lg shadow-md p-6">
                            <h3 className="text-lg font-semibold text-gray-700 mb-2">📊 Gewinn/Verlust</h3>
                            <p className={`text-3xl font-bold ${einnahmen - ausgaben >= 0 ? 'text-green-600' : 'text-red-600'}`}>
                                {(einnahmen - ausgaben).toFixed(2)} €
                            </p>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<BuchhaltungApp />, document.getElementById('root'));
    </script>
</body>
</html>

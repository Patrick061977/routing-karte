
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Routing mit Karte – Patch v4 (Regex Matching)</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; }
    input, button { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; }
    #map { height: 400px; margin-top: 10px; border: 1px solid #ccc; }
    #output { margin-top: 15px; font-weight: bold; white-space: pre-line; color: #333; }
  </style>
</head>
<body>
  <h3>📍 Routing mit Karte & Entfernung (Patch v4 – Regex Matching)</h3>
  <input id="start" type="text" placeholder="Startadresse" />
  <input id="ziel" type="text" placeholder="Zieladresse" />
  <button onclick="routeBerechnen()">Route anzeigen</button>
  <div id="map"></div>
  <div id="output"></div>

  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  <script>
    let map = L.map('map').setView([53.94, 14.18], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);
    let routeLayer = null;

    const ersatzRegeln = [
      { pattern: /kaiserhof/i, adresse: "Kulmstraße 33, Heringsdorf" },
      { pattern: /bahnhof.*heringsdorf/i, adresse: "Bahnhofstraße, 17424 Heringsdorf" },
      { pattern: /bleichröder/i, adresse: "Delbrückstraße 14, Heringsdorf" },
      { pattern: /(hotel )?das ahlbeck/i, adresse: "Dünenstraße 48, Ahlbeck" },
      { pattern: /ahlbeck hotel/i, adresse: "Dünenstraße 48, Ahlbeck" }
    ];

    function ersetzeAdresse(eingabe) {
      for (const regel of ersatzRegeln) {
        if (regel.pattern.test(eingabe)) {
          return regel.adresse;
        }
      }
      return eingabe;
    }

    async function geocode(adresse) {
      try {
        const res = await axios.get('https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(adresse));
        if (res.data.length > 0) {
          const { lat, lon } = res.data[0];
          return [parseFloat(lon), parseFloat(lat)];
        }
        return null;
      } catch {
        return null;
      }
    }

    async function routeBerechnen() {
      const eingabeStart = ersetzeAdresse(document.getElementById("start").value.toLowerCase());
      const eingabeZiel = ersetzeAdresse(document.getElementById("ziel").value.toLowerCase());
      const output = document.getElementById("output");

      output.innerText = "⏳ Berechne Route...";
      const startCoords = await geocode(eingabeStart);
      const zielCoords = await geocode(eingabeZiel);

      if (!startCoords || !zielCoords) {
        output.innerText = "❌ Start oder Ziel konnte nicht gefunden werden.";
        return;
      }

      try {
        const orsKey = "5b3ce3597851110001cf624864d10057469046c38589c8593923a932";
        const response = await axios.post(
          "https://api.openrouteservice.org/v2/directions/driving-car",
          { coordinates: [startCoords, zielCoords] },
          { headers: { Authorization: orsKey } }
        );

        const distKm = response.data.features[0].properties.summary.distance / 1000;
        const zeitMin = response.data.features[0].properties.summary.duration / 60;

        if (routeLayer) map.removeLayer(routeLayer);
        routeLayer = L.geoJSON(response.data).addTo(map);
        map.fitBounds(routeLayer.getBounds());

        output.innerText = `🛣️ Entfernung: ${distKm.toFixed(2).replace('.', ',')} km\n⏱️ Dauer: ${zeitMin.toFixed(0)} Minuten`;
      } catch (err) {
        console.error("❌ Routing-Fehler:", err);
        output.innerText = "❌ Route konnte nicht berechnet werden.";
      }
    }
  </script>
</body>
</html>
